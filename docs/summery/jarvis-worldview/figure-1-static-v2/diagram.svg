<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1180" viewBox="0 0 1920 1180">
  <rect x="0" y="0" width="1920" height="1180" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="92" y="62" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#2F6BEB" letter-spacing="1.8">FIG. 01  ·  WORLD VIEW</text>
  <text x="92" y="122" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="48" font-weight="750" fill="#0F172A">什么是 Jarvis 的世界观</text>
  <text x="92" y="162" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="20" fill="#64748B">以 Principal 为坐标，把实体、认知与未闭环行动组织成同一张持续演化的工作世界</text>

  <g font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#475569">
    <circle cx="1275" cy="112" r="6" fill="#2F6BEB"/><text x="1290" y="117">实体网络</text>
    <circle cx="1395" cy="112" r="6" fill="#16A276"/><text x="1410" y="117">当前认知</text>
    <circle cx="1518" cy="112" r="6" fill="#D97706"/><text x="1533" y="117">历史事实</text>
    <circle cx="1638" cy="112" r="6" fill="#7C3AED"/><text x="1653" y="117">认知版本</text>
    <circle cx="1762" cy="112" r="6" fill="#0F9F8A"/><text x="1777" y="117">行动状态</text>
  </g>
  <line x1="92" y1="188" x2="1828" y2="188" stroke="#DCE5F0" stroke-width="2"/>

  <!-- System boundary -->
  <rect x="76" y="220" width="1768" height="780" rx="34" fill="#F8FAFC" stroke="#D8E3EF" stroke-width="2"/>
  <rect x="112" y="246" width="284" height="36" rx="18" fill="#EAF1FF"/>
  <text x="136" y="271" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#2459C4">JARVIS WORLD · 工作世界</text>
  <text x="1608" y="270" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#64748B">系统边界</text>
  <line x1="1690" y1="264" x2="1800" y2="264" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- Entity network field -->
  <rect x="112" y="304" width="1050" height="474" rx="26" fill="#FFFFFF" stroke="#D9E6F5" stroke-width="2"/>
  <text x="148" y="350" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#0F172A">实体网络</text>
  <text x="148" y="382" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="16" fill="#64748B">人、事、物与协作场，围绕 Principal 形成可理解的工作上下文</text>
  <line x1="846" y1="348" x2="886" y2="348" stroke="#2F6BEB" stroke-width="3"/>
  <text x="900" y="353" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" font-weight="650" fill="#475569">关系维度</text>
  <text x="980" y="353" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#64748B">职责 · 归属 · 协作 · 引用</text>

  <!-- Field contours -->
  <ellipse cx="627" cy="565" rx="365" ry="172" fill="#F7FAFF" stroke="#DCE8FA" stroke-width="2" stroke-dasharray="8 10"/>
  <ellipse cx="627" cy="565" rx="255" ry="124" fill="none" stroke="#E8EEF7" stroke-width="2"/>

  <!-- Relationship lines, kept low weight -->
  <polyline points="537,565 502,565 502,466 410,466" fill="none" stroke="#B8C7DB" stroke-width="2"/>
  <polyline points="627,475 627,434 758,434" fill="none" stroke="#B8C7DB" stroke-width="2"/>
  <polyline points="717,565 764,565 764,525 871,525" fill="none" stroke="#B8C7DB" stroke-width="2"/>
  <polyline points="627,655 627,696 723,696" fill="none" stroke="#B8C7DB" stroke-width="2"/>
  <polyline points="537,565 490,565 490,658 394,658" fill="none" stroke="#B8C7DB" stroke-width="2"/>

  <!-- Principal -->
  <circle cx="627" cy="565" r="115" fill="#EAF2FF" stroke="#83B2FF" stroke-width="2.5"/>
  <circle cx="627" cy="565" r="88" fill="#245FDB"/>
  <circle cx="627" cy="510" r="19" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M586 558 C594 530 660 530 668 558" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="627" y="592" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="24" font-weight="750" fill="#FFFFFF">Principal / 我</text>
  <text x="627" y="621" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" fill="#DDE9FF">责任 · 价值 · 边界</text>
  <rect x="514" y="677" width="226" height="34" rx="17" fill="#EAF2FF" stroke="#B9D4FF"/>
  <text x="627" y="700" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#2459C4">坐标原点，不是普通实体节点</text>

  <!-- Entity cards -->
  <g font-family="Noto Sans SC, PingFang SC, sans-serif">
    <rect x="178" y="420" width="232" height="92" rx="18" fill="#FFFFFF" stroke="#8DB8FF" stroke-width="2"/>
    <circle cx="210" cy="452" r="11" fill="#EAF2FF" stroke="#2F6BEB" stroke-width="2"/>
    <text x="236" y="458" font-size="19" font-weight="700" fill="#172033">Person / 人</text>
    <text x="210" y="486" font-size="14" fill="#64748B">角色 · 职责 · 承诺</text>

    <rect x="758" y="388" width="258" height="92" rx="18" fill="#FFFFFF" stroke="#8DB8FF" stroke-width="2"/>
    <rect x="786" y="420" width="22" height="22" rx="6" fill="#EAF2FF" stroke="#2F6BEB" stroke-width="2"/>
    <text x="822" y="438" font-size="19" font-weight="700" fill="#172033">Project / 项目</text>
    <text x="786" y="462" font-size="14" fill="#64748B">目标 · 进展 · 风险</text>

    <rect x="871" y="480" width="254" height="92" rx="18" fill="#FFFFFF" stroke="#8DB8FF" stroke-width="2"/>
    <circle cx="904" cy="512" r="11" fill="#EAF2FF" stroke="#2F6BEB" stroke-width="2"/>
    <text x="930" y="518" font-size="19" font-weight="700" fill="#172033">Key Matter</text>
    <text x="904" y="546" font-size="14" fill="#64748B">长期看护 · 尚待闭环</text>

    <rect x="723" y="650" width="274" height="92" rx="18" fill="#FFFFFF" stroke="#8DB8FF" stroke-width="2"/>
    <rect x="751" y="681" width="22" height="24" rx="5" fill="#EAF2FF" stroke="#2F6BEB" stroke-width="2"/>
    <line x1="757" y1="688" x2="767" y2="688" stroke="#2F6BEB" stroke-width="2"/>
    <line x1="757" y1="695" x2="767" y2="695" stroke="#2F6BEB" stroke-width="2"/>
    <text x="788" y="698" font-size="19" font-weight="700" fill="#172033">Resource / 资源</text>
    <text x="751" y="724" font-size="14" fill="#64748B">文档 · 仓库 · 系统入口</text>

    <rect x="170" y="612" width="224" height="92" rx="18" fill="#FFFFFF" stroke="#8DB8FF" stroke-width="2"/>
    <circle cx="203" cy="645" r="11" fill="#EAF2FF" stroke="#2F6BEB" stroke-width="2"/>
    <circle cx="203" cy="645" r="4" fill="#2F6BEB"/>
    <text x="229" y="651" font-size="19" font-weight="700" fill="#172033">Group / 群</text>
    <text x="203" y="679" font-size="14" fill="#64748B">协作场 · 群上下文</text>
  </g>

  <!-- Time dimension -->
  <line x1="174" y1="758" x2="1102" y2="758" stroke="#CCD7E5" stroke-width="2"/>
  <circle cx="214" cy="758" r="6" fill="#D97706"/>
  <circle cx="637" cy="758" r="6" fill="#16A276"/>
  <circle cx="1062" cy="758" r="6" fill="#0F9F8A"/>
  <text x="174" y="730" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" fill="#8A5A13">过去的证据</text>
  <text x="594" y="730" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" fill="#087A5A">当前认知</text>
  <text x="998" y="730" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" fill="#087D72">未闭环行动</text>
  <text x="550" y="775" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" fill="#64748B">时间维度贯穿所有实体与关系</text>

  <!-- Entity cognition inset -->
  <rect x="1200" y="304" width="608" height="474" rx="26" fill="#FFFFFF" stroke="#D9E6F5" stroke-width="2"/>
  <rect x="1240" y="330" width="136" height="32" rx="16" fill="#EEF2FF"/>
  <text x="1308" y="352" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#5B45B8">任一长期实体</text>
  <text x="1240" y="402" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#0F172A">实体的认知结构</text>
  <text x="1240" y="432" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" fill="#64748B">不是材料堆积，而是一套当前结论、事实依据与认知版本</text>

  <rect x="1240" y="466" width="520" height="116" rx="18" fill="#F0FBF7" stroke="#55CDA6" stroke-width="2"/>
  <rect x="1240" y="466" width="8" height="116" rx="4" fill="#16A276"/>
  <text x="1276" y="506" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="24" font-weight="750" fill="#087A5A">Summary</text>
  <text x="1432" y="505" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#16A276">当前认知 · 现在是什么</text>
  <text x="1276" y="542" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" fill="#526C64">对实体当前状态的压缩结论，是下一轮判断首先读取的内容</text>
  <text x="1276" y="566" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#7A928B">随可靠新证据整体修正</text>

  <rect x="1240" y="606" width="328" height="118" rx="18" fill="#FFFAEB" stroke="#F0B44B" stroke-width="2"/>
  <rect x="1240" y="606" width="8" height="118" rx="4" fill="#D97706"/>
  <text x="1276" y="648" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" font-weight="750" fill="#A85406">Fact</text>
  <text x="1276" y="676" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#D97706">历史事实 · 发生过什么</text>
  <text x="1276" y="704" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" fill="#7A6240">带时间和来源，支撑或纠正 Summary</text>

  <rect x="1586" y="606" width="174" height="118" rx="18" fill="#F6F2FF" stroke="#B29AF5" stroke-width="2"/>
  <rect x="1586" y="606" width="8" height="118" rx="4" fill="#7C3AED"/>
  <text x="1614" y="648" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="17" font-weight="750" fill="#6630C3">PageRevision</text>
  <text x="1614" y="678" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#7C3AED">旧版 Summary</text>
  <text x="1614" y="704" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12" fill="#74658C">认知如何变化</text>

  <line x1="1404" y1="592" x2="1404" y2="582" stroke="#D97706" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="1673" y1="592" x2="1673" y2="582" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="1498" y="750" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#64748B">Fact 记录现实变化；PageRevision 记录 Jarvis 的理解怎样变化</text>

  <!-- Action state band -->
  <rect x="112" y="808" width="1696" height="146" rx="24" fill="#EEFCF8" stroke="#7ADDC6" stroke-width="2"/>
  <text x="152" y="852" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="24" font-weight="750" fill="#087D72">正在发生的行动状态</text>
  <text x="152" y="883" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" fill="#5B7D77">它不属于长期实体，却回答世界中还有什么尚未闭环</text>

  <rect x="616" y="836" width="226" height="78" rx="16" fill="#FFFFFF" stroke="#28BFA0" stroke-width="2"/>
  <text x="729" y="870" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="20" font-weight="750" fill="#144B46">Todo</text>
  <text x="729" y="896" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" fill="#64827E">发现了什么值得关注</text>

  <line x1="842" y1="875" x2="902" y2="875" stroke="#0F9F8A" stroke-width="4"/>
  <polygon points="902,875 884,864 884,886" fill="#0F9F8A"/>

  <rect x="902" y="836" width="226" height="78" rx="16" fill="#FFFFFF" stroke="#28BFA0" stroke-width="2"/>
  <text x="1015" y="870" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="20" font-weight="750" fill="#144B46">Task</text>
  <text x="1015" y="896" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" fill="#64827E">正在承接什么目标</text>

  <line x1="1128" y1="875" x2="1188" y2="875" stroke="#0F9F8A" stroke-width="4"/>
  <polygon points="1188,875 1170,864 1170,886" fill="#0F9F8A"/>

  <rect x="1188" y="836" width="258" height="78" rx="16" fill="#FFFFFF" stroke="#28BFA0" stroke-width="2"/>
  <text x="1317" y="870" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="20" font-weight="750" fill="#144B46">ExecutionRun</text>
  <text x="1317" y="896" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" fill="#64827E">某次执行做到了哪里</text>

  <text x="1525" y="861" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#087D72">未闭环的现实</text>
  <text x="1525" y="889" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#64827E">线索、目标与执行结果</text>
  <text x="1525" y="913" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#64827E">共同构成当前世界状态</text>

  <!-- Formula -->
  <rect x="214" y="1034" width="1492" height="92" rx="20" fill="#0F172A"/>
  <circle cx="286" cy="1080" r="8" fill="#2F6BEB"/>
  <text x="308" y="1088" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Principal 坐标</text>
  <text x="488" y="1088" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" fill="#7890AE">+</text>
  <circle cx="534" cy="1080" r="8" fill="#2F6BEB"/>
  <text x="556" y="1088" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">实体网络</text>
  <text x="680" y="1088" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" fill="#7890AE">+</text>
  <circle cx="726" cy="1080" r="8" fill="#16A276"/>
  <text x="748" y="1088" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">实体认知</text>
  <text x="872" y="1088" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" fill="#7890AE">+</text>
  <circle cx="918" cy="1080" r="8" fill="#0F9F8A"/>
  <text x="940" y="1088" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">行动状态</text>
  <text x="1080" y="1088" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" fill="#7890AE">=</text>
  <text x="1124" y="1088" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="24" font-weight="750" fill="#DCE8FF">Jarvis 的世界观</text>
</svg>
