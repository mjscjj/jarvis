<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="104" y="68" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#356FE7" letter-spacing="2">FIG. 01  ·  JARVIS WORLD</text>
  <text x="104" y="132" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="48" font-weight="750" fill="#0F172A">Jarvis 眼中的世界：人、事、物</text>
  <text x="104" y="172" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="20" fill="#64748B">不是一份组织百科，而是与 Principal 的责任、目标和行动相关的工作世界</text>
  <line x1="104" y1="204" x2="1816" y2="204" stroke="#DFE7F1" stroke-width="2"/>

  <!-- World boundary -->
  <rect x="84" y="236" width="1752" height="714" rx="42" fill="#FBFCFE" stroke="#CBD8E8" stroke-width="2.5"/>

  <!-- Three semantic fields -->
  <ellipse cx="468" cy="585" rx="330" ry="270" fill="#F1F6FF" stroke="#8DB8FF" stroke-width="2.5"/>
  <ellipse cx="1336" cy="468" rx="386" ry="218" fill="#FFF7EA" stroke="#F0B85A" stroke-width="2.5"/>
  <ellipse cx="1362" cy="737" rx="366" ry="176" fill="#EEFBF7" stroke="#61CDB0" stroke-width="2.5"/>

  <!-- Field titles -->
  <text x="188" y="378" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="68" font-weight="800" fill="#245FDB">人</text>
  <text x="188" y="410" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#5A83D1" letter-spacing="2">PEOPLE</text>
  <text x="1588" y="346" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="68" font-weight="800" fill="#D97706">事</text>
  <text x="1588" y="378" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#B77824" letter-spacing="2">MATTERS</text>
  <text x="1608" y="686" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="68" font-weight="800" fill="#0B937C">物</text>

  <!-- Two cross-category relations; the main connections stay on Principal -->
  <polyline points="590,454 810,454 810,420 1110,420" fill="none" stroke="#A7B8CE" stroke-width="2.5"/>
  <polyline points="1236,472 1236,606 1201,606 1201,666" fill="none" stroke="#A7B8CE" stroke-width="2.5"/>
  <text x="826" y="410" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#71839A">共同推进</text>
  <text x="1248" y="570" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#71839A">依赖</text>

  <!-- People nodes: circles -->
  <g font-family="Noto Sans SC, PingFang SC, sans-serif">
    <circle cx="326" cy="520" r="60" fill="#FFFFFF" stroke="#5C93F5" stroke-width="2.5"/>
    <circle cx="326" cy="498" r="14" fill="none" stroke="#356FE7" stroke-width="2.5"/>
    <path d="M298 532 C304 510 348 510 354 532" fill="none" stroke="#356FE7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="326" y="559" text-anchor="middle" font-size="15" font-weight="700" fill="#244A87">负责人</text>

    <circle cx="530" cy="454" r="60" fill="#FFFFFF" stroke="#5C93F5" stroke-width="2.5"/>
    <circle cx="530" cy="432" r="14" fill="none" stroke="#356FE7" stroke-width="2.5"/>
    <path d="M502 466 C508 444 552 444 558 466" fill="none" stroke="#356FE7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="530" y="493" text-anchor="middle" font-size="15" font-weight="700" fill="#244A87">协作者</text>

    <circle cx="402" cy="710" r="60" fill="#FFFFFF" stroke="#5C93F5" stroke-width="2.5"/>
    <circle cx="402" cy="688" r="14" fill="none" stroke="#356FE7" stroke-width="2.5"/>
    <path d="M374 722 C380 700 424 700 430 722" fill="none" stroke="#356FE7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="402" y="749" text-anchor="middle" font-size="15" font-weight="700" fill="#244A87">决策者</text>
  </g>

  <!-- Matter nodes: rounded shapes -->
  <rect x="1110" y="368" width="252" height="104" rx="24" fill="#FFFFFF" stroke="#E9A63A" stroke-width="2.5"/>
  <rect x="1138" y="396" width="34" height="34" rx="9" fill="#FFF0D1" stroke="#D97706" stroke-width="2"/>
  <text x="1192" y="416" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" font-weight="750" fill="#7F4708">Project</text>
  <text x="1192" y="446" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#9A6A2D">长期目标 · 进展 · 风险</text>

  <rect x="1390" y="438" width="266" height="104" rx="52" fill="#FFFFFF" stroke="#E9A63A" stroke-width="2.5"/>
  <circle cx="1434" cy="490" r="17" fill="#FFF0D1" stroke="#D97706" stroke-width="2"/>
  <text x="1472" y="482" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="21" font-weight="750" fill="#7F4708">Key Matter</text>
  <text x="1472" y="512" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#9A6A2D">需要持续看护的事项</text>

  <!-- Resource nodes: square objects -->
  <g font-family="Noto Sans SC, PingFang SC, sans-serif">
    <rect x="1126" y="666" width="150" height="116" rx="20" fill="#FFFFFF" stroke="#35B99C" stroke-width="2.5"/>
    <rect x="1180" y="690" width="42" height="48" rx="7" fill="#DDF7F0" stroke="#0B937C" stroke-width="2"/>
    <line x1="1190" y1="705" x2="1212" y2="705" stroke="#0B937C" stroke-width="2"/>
    <line x1="1190" y1="716" x2="1212" y2="716" stroke="#0B937C" stroke-width="2"/>
    <text x="1201" y="766" text-anchor="middle" font-size="15" font-weight="700" fill="#19695C">文档</text>

    <rect x="1310" y="732" width="150" height="116" rx="20" fill="#FFFFFF" stroke="#35B99C" stroke-width="2.5"/>
    <rect x="1360" y="758" width="50" height="38" rx="8" fill="#DDF7F0" stroke="#0B937C" stroke-width="2"/>
    <line x1="1370" y1="770" x2="1400" y2="770" stroke="#0B937C" stroke-width="2"/>
    <line x1="1370" y1="782" x2="1392" y2="782" stroke="#0B937C" stroke-width="2"/>
    <text x="1385" y="830" text-anchor="middle" font-size="15" font-weight="700" fill="#19695C">仓库</text>

    <rect x="1492" y="694" width="150" height="116" rx="20" fill="#FFFFFF" stroke="#35B99C" stroke-width="2.5"/>
    <rect x="1542" y="720" width="50" height="38" rx="8" fill="#DDF7F0" stroke="#0B937C" stroke-width="2"/>
    <circle cx="1554" cy="739" r="4" fill="#0B937C"/>
    <circle cx="1567" cy="739" r="4" fill="#0B937C"/>
    <circle cx="1580" cy="739" r="4" fill="#0B937C"/>
    <text x="1567" y="792" text-anchor="middle" font-size="15" font-weight="700" fill="#19695C">系统</text>
  </g>

  <!-- Principal, above the relationship web -->
  <circle cx="878" cy="586" r="142" fill="#E7F0FF" stroke="#72A6FF" stroke-width="3"/>
  <circle cx="878" cy="586" r="106" fill="#1F55C7"/>
  <circle cx="878" cy="528" r="20" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M838 574 C846 546 910 546 918 574" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="878" y="620" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="26" font-weight="760" fill="#FFFFFF">Principal / 我</text>
  <text x="878" y="652" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#DCE8FF">责任 · 目标 · 价值 · 边界</text>
  <rect x="756" y="704" width="244" height="36" rx="18" fill="#EAF2FF" stroke="#AFCBFB"/>
  <text x="878" y="728" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#245BC6">世界的观察与责任坐标</text>

  <!-- Principal relationships -->
  <line x1="736" y1="586" x2="590" y2="586" stroke="#356FE7" stroke-width="4"/>
  <line x1="1002" y1="525" x2="1110" y2="438" stroke="#D97706" stroke-width="4"/>
  <line x1="1007" y1="648" x2="1126" y2="714" stroke="#0B937C" stroke-width="4"/>
  <rect x="638" y="558" width="78" height="28" rx="14" fill="#FFFFFF" stroke="#B8CDF1"/>
  <text x="677" y="578" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#356FE7">协作</text>
  <rect x="1028" y="456" width="78" height="28" rx="14" fill="#FFFFFF" stroke="#F0C274"/>
  <text x="1067" y="476" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#B45F06">负责</text>
  <rect x="1038" y="672" width="78" height="28" rx="14" fill="#FFFFFF" stroke="#7DD6C0"/>
  <text x="1077" y="692" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#0B8370">使用</text>

  <!-- Closing statement -->
  <line x1="260" y1="876" x2="1660" y2="876" stroke="#D7E0EB" stroke-width="2"/>
  <circle cx="592" cy="906" r="7" fill="#356FE7"/>
  <text x="614" y="914" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="23" font-weight="720" fill="#1D3557">谁</text>
  <text x="646" y="914" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="23" fill="#64748B">在推进</text>
  <circle cx="756" cy="906" r="7" fill="#D97706"/>
  <text x="778" y="914" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="23" font-weight="720" fill="#7F4708">什么事</text>
  <text x="866" y="914" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="23" fill="#64748B">，依赖</text>
  <circle cx="960" cy="906" r="7" fill="#0B937C"/>
  <text x="982" y="914" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="23" font-weight="720" fill="#19695C">哪些物</text>
  <text x="1070" y="914" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="23" fill="#64748B">——共同构成 Jarvis 的工作世界</text>
</svg>
