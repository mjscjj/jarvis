<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
  <title id="title">一只抱着小鱼的可爱橘猫</title>
  <desc id="desc">奶油色圆角背景中，一只戴着蓝色蝴蝶结的橘猫开心地抱着粉色小鱼，周围点缀着星星和爱心。</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="840" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7D9"/>
      <stop offset="1" stop-color="#FFE5EC"/>
    </linearGradient>
    <linearGradient id="fur" x1="310" y1="250" x2="650" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC86B"/>
      <stop offset="1" stop-color="#F7A84C"/>
    </linearGradient>
    <linearGradient id="fish" x1="395" y1="610" x2="579" y2="710" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9EAF"/>
      <stop offset="1" stop-color="#FF7694"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#D68F72" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect x="42" y="42" width="876" height="876" rx="100" fill="url(#bg)"/>

  <!-- playful decorations -->
  <g fill="#FFF" opacity=".9">
    <circle cx="186" cy="230" r="18"/>
    <circle cx="800" cy="300" r="13"/>
    <circle cx="160" cy="690" r="11"/>
  </g>
  <g fill="#FF83A0">
    <path d="M752 174c-31-33-83 12-29 60 54-48 2-93-29-60 15 17 29 29 29 29s14-12 29-29Z"/>
    <path d="M208 444c-20-22-54 8-19 39 35-31 1-61-19-39 10 11 19 19 19 19s9-8 19-19Z" opacity=".75"/>
  </g>
  <g fill="#F7BD42">
    <path d="m155 307 10 25 25 10-25 10-10 25-10-25-25-10 25-10 10-25Z"/>
    <path d="m796 548 8 20 20 8-20 8-8 20-8-20-20-8 20-8 8-20Z"/>
  </g>

  <!-- cat and tail -->
  <g filter="url(#shadow)">
    <path d="M647 598c78-8 129 32 128 93-1 66-73 98-128 69" fill="none" stroke="#F3A144" stroke-width="72" stroke-linecap="round"/>
    <path d="M722 621c21 9 35 26 35 48" fill="none" stroke="#D98737" stroke-width="18" stroke-linecap="round" opacity=".7"/>

    <!-- body -->
    <ellipse cx="480" cy="660" rx="194" ry="174" fill="url(#fur)" stroke="#5B4650" stroke-width="12"/>
    <ellipse cx="480" cy="682" rx="116" ry="107" fill="#FFE8BB" opacity=".9"/>

    <!-- ears behind head -->
    <path d="M319 339 299 173c-2-19 19-31 34-19l113 92Z" fill="url(#fur)" stroke="#5B4650" stroke-width="12" stroke-linejoin="round"/>
    <path d="m329 280-10-87 62 55Z" fill="#FF9CA9"/>
    <path d="m641 339 20-166c2-19-19-31-34-19l-113 92Z" fill="url(#fur)" stroke="#5B4650" stroke-width="12" stroke-linejoin="round"/>
    <path d="m631 280 10-87-62 55Z" fill="#FF9CA9"/>

    <!-- head -->
    <path d="M659 378c0 119-80 207-179 207s-179-88-179-207c0-99 80-170 179-170s179 71 179 170Z" fill="url(#fur)" stroke="#5B4650" stroke-width="12"/>

    <!-- forehead stripes -->
    <g fill="none" stroke="#D98737" stroke-width="17" stroke-linecap="round">
      <path d="m442 232 12 57"/>
      <path d="m480 224v62"/>
      <path d="m518 232-12 57"/>
    </g>

    <!-- muzzle -->
    <ellipse cx="439" cy="453" rx="70" ry="58" fill="#FFF0D2"/>
    <ellipse cx="521" cy="453" rx="70" ry="58" fill="#FFF0D2"/>

    <!-- happy face -->
    <g fill="none" stroke="#5B4650" stroke-width="13" stroke-linecap="round">
      <path d="M359 376c18-24 48-24 66 0"/>
      <path d="M535 376c18-24 48-24 66 0"/>
      <path d="M480 438v17"/>
      <path d="M480 455c-7 30-50 29-55 1"/>
      <path d="M480 455c7 30 50 29 55 1"/>
    </g>
    <path d="M461 429c0-15 38-15 38 0 0 11-19 21-19 21s-19-10-19-21Z" fill="#E86F83"/>
    <path d="M464 481c10 17 22 22 33 0" fill="#EF7890"/>

    <!-- cheeks and whiskers -->
    <g fill="#F58486" opacity=".52">
      <ellipse cx="354" cy="439" rx="32" ry="18"/>
      <ellipse cx="606" cy="439" rx="32" ry="18"/>
    </g>
    <g fill="none" stroke="#5B4650" stroke-width="8" stroke-linecap="round">
      <path d="m369 444-91-14"/>
      <path d="m371 468-84 22"/>
      <path d="m591 444 91-14"/>
      <path d="m589 468 84 22"/>
    </g>

    <!-- bow tie -->
    <path d="M480 565c-41-37-101-31-105 14-4 43 58 67 105 26Z" fill="#65C8E8" stroke="#5B4650" stroke-width="10"/>
    <path d="M480 565c41-37 101-31 105 14 4 43-58 67-105 26Z" fill="#65C8E8" stroke="#5B4650" stroke-width="10"/>
    <circle cx="480" cy="586" r="28" fill="#3FABD0" stroke="#5B4650" stroke-width="10"/>

    <!-- fish -->
    <path d="M425 647c34-54 101-56 144-11l49-31-8 58 8 58-49-31c-43 45-110 43-144-11-6-10-6-22 0-32Z" fill="url(#fish)" stroke="#5B4650" stroke-width="11" stroke-linejoin="round"/>
    <circle cx="453" cy="663" r="8" fill="#5B4650"/>
    <path d="M520 628c-15 23-15 47 0 70" fill="none" stroke="#E05F7E" stroke-width="10" stroke-linecap="round"/>

    <!-- paws hugging the fish -->
    <ellipse cx="385" cy="648" rx="61" ry="46" transform="rotate(24 385 648)" fill="#FFC263" stroke="#5B4650" stroke-width="11"/>
    <ellipse cx="575" cy="648" rx="61" ry="46" transform="rotate(-24 575 648)" fill="#FFC263" stroke="#5B4650" stroke-width="11"/>
    <g fill="none" stroke="#D98737" stroke-width="8" stroke-linecap="round">
      <path d="m374 638-4 17"/>
      <path d="m396 642-4 17"/>
      <path d="m586 638 4 17"/>
      <path d="m564 642 4 17"/>
    </g>

    <!-- feet -->
    <ellipse cx="376" cy="779" rx="84" ry="50" fill="#FFC263" stroke="#5B4650" stroke-width="12"/>
    <ellipse cx="584" cy="779" rx="84" ry="50" fill="#FFC263" stroke="#5B4650" stroke-width="12"/>
    <g fill="#F4957D" opacity=".75">
      <ellipse cx="376" cy="783" rx="27" ry="19"/>
      <ellipse cx="584" cy="783" rx="27" ry="19"/>
    </g>
  </g>

  <path d="M337 847c82 19 204 19 286 0" fill="none" stroke="#E7B0A4" stroke-width="11" stroke-linecap="round" opacity=".45"/>
</svg>
