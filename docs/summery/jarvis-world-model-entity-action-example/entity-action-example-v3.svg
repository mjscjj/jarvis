<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E3921F"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .title { fill: #1A3A3A; font-size: 28px; font-weight: 700; }
      .subtitle { fill: #5A7A7A; font-size: 14px; }
      .lane-title { fill: #1A3A3A; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .lane-subtitle { fill: #5A7A7A; font-size: 11px; text-anchor: middle; }
      .lane-note { fill: #238377; font-size: 11px; text-anchor: middle; }
      .card-title { fill: #1A3A3A; font-size: 16px; font-weight: 700; }
      .card-example { fill: #238377; font-size: 11px; }
      .card-line { fill: #5A7A7A; font-size: 11px; }
      .card-key { fill: #238377; font-weight: 600; }
      .action-title { fill: #1A3A3A; font-size: 17px; font-weight: 700; }
      .action-line { fill: #5A7A7A; font-size: 11px; }
      .action-success { fill: #368545; font-size: 11px; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <text x="60" y="58" class="title">一个完整例子：每个实体里实际会写什么</text>
  <text x="60" y="96" class="subtitle">同一套 Jarvis 语境；卡片展示的是实体 Summary 示例，不是固定表单字段</text>

  <g transform="translate(1500 119)">
    <circle cx="0" cy="0" r="5" fill="#54B49D"/>
    <text x="14" y="4" class="subtitle" font-size="11">长期实体内容</text>
    <circle cx="132" cy="0" r="5" fill="#E3921F"/>
    <text x="146" y="4" class="subtitle" font-size="11">实时行动内容</text>
  </g>

  <rect x="60" y="135" width="1800" height="610" rx="18" fill="#F2FBF8" stroke="#B0D0C5" stroke-width="1.2"/>
  <rect x="60" y="770" width="1800" height="250" rx="18" fill="#FBF7F1" stroke="#E3921F" stroke-width="1.2"/>
  <line x1="255" y1="155" x2="255" y2="725" stroke="#B0D0C5" stroke-width="1.2"/>
  <line x1="255" y1="790" x2="255" y2="1000" stroke="#E3921F" stroke-width="1.2"/>

  <text x="158" y="319" class="lane-title">长期实体层</text>
  <text x="158" y="346" class="lane-subtitle">持续维护的世界坐标</text>
  <text x="158" y="437" class="lane-note">每个实体是一段</text>
  <text x="158" y="456" class="lane-note">可持续更新的当前认知</text>

  <text x="158" y="866" class="lane-title">实时行动层</text>
  <text x="158" y="893" class="lane-subtitle">一次工作的状态记录</text>

  <g>
    <rect x="300" y="185" width="460" height="200" rx="16" fill="#E0F5F0" stroke="#54B49D" stroke-width="1.2"/>
    <text x="325" y="226" class="card-title">Principal</text>
    <text x="422" y="226" class="card-example">示例：我</text>
    <text x="325" y="276" class="card-line"><tspan class="card-key">长期目标：</tspan><tspan>把 Jarvis 做成主动式数字分身</tspan></text>
    <text x="325" y="311" class="card-line"><tspan class="card-key">负责：</tspan><tspan>项目方向与最终决策</tspan></text>
    <text x="325" y="346" class="card-line"><tspan class="card-key">偏好：</tspan><tspan>先看预览，确认后再写回</tspan></text>

    <rect x="805" y="185" width="460" height="200" rx="16" fill="#E0F5F0" stroke="#54B49D" stroke-width="1.2"/>
    <text x="830" y="226" class="card-title">Person</text>
    <text x="905" y="226" class="card-example">示例：王磊（示例人物）</text>
    <text x="830" y="276" class="card-line"><tspan class="card-key">角色：</tspan><tspan>Jarvis 项目协作者、文章评审人</tspan></text>
    <text x="830" y="311" class="card-line"><tspan class="card-key">关注：</tspan><tspan>读者能否看懂世界模型</tspan></text>
    <text x="830" y="346" class="card-line"><tspan class="card-key">关系：</tspan><tspan>协作于 Project / Jarvis</tspan></text>

    <rect x="1310" y="185" width="460" height="200" rx="16" fill="#CCF0E8" stroke="#2A9D8F" stroke-width="2"/>
    <text x="1335" y="226" class="card-title">Project</text>
    <text x="1413" y="226" class="card-example">示例：Jarvis</text>
    <text x="1335" y="276" class="card-line"><tspan class="card-key">目标：</tspan><tspan>主动发现并完成有价值的工作</tspan></text>
    <text x="1335" y="311" class="card-line"><tspan class="card-key">当前状态：</tspan><tspan>世界模型章节完善中</tspan></text>
    <text x="1335" y="346" class="card-line"><tspan class="card-key">资料：</tspan><tspan>关联《主动式数字分身》文档</tspan></text>

    <rect x="300" y="430" width="460" height="200" rx="16" fill="#E0F5F0" stroke="#54B49D" stroke-width="1.2"/>
    <text x="325" y="471" class="card-title">KeyMatter</text>
    <text x="431" y="471" class="card-example">示例：讲清实体层与行动层</text>
    <text x="325" y="521" class="card-line"><tspan class="card-key">问题：</tspan><tspan>现有图只展示类型，没有展示内容</tspan></text>
    <text x="325" y="556" class="card-line"><tspan class="card-key">进展：</tspan><tspan>结构图已完成，正在补实例</tspan></text>
    <text x="325" y="591" class="card-line"><tspan class="card-key">归属：</tspan><tspan>Project / Jarvis</tspan></text>

    <rect x="805" y="430" width="460" height="200" rx="16" fill="#E0F5F0" stroke="#54B49D" stroke-width="1.2"/>
    <text x="830" y="471" class="card-title">Group</text>
    <text x="897" y="471" class="card-example">示例：Jarvis 项目群</text>
    <text x="830" y="521" class="card-line"><tspan class="card-key">用途：</tspan><tspan>方案讨论、评审与反馈</tspan></text>
    <text x="830" y="556" class="card-line"><tspan class="card-key">成员：</tspan><tspan>Principal + 项目协作者</tspan></text>
    <text x="830" y="591" class="card-line"><tspan class="card-key">关系：</tspan><tspan>围绕 Project / Jarvis</tspan></text>

    <rect x="1310" y="430" width="460" height="200" rx="16" fill="#E0F5F0" stroke="#54B49D" stroke-width="1.2"/>
    <text x="1335" y="471" class="card-title">Resource</text>
    <text x="1426" y="471" class="card-example">示例：《主动式数字分身》</text>
    <text x="1335" y="521" class="card-line"><tspan class="card-key">类型：</tspan><tspan>飞书 Wiki 文档</tspan></text>
    <text x="1335" y="556" class="card-line"><tspan class="card-key">内容：</tspan><tspan>世界建模章节与配图</tspan></text>
    <text x="1335" y="591" class="card-line"><tspan class="card-key">归属：</tspan><tspan>Project / Jarvis</tspan></text>
  </g>

  <rect x="300" y="665" width="1470" height="48" rx="14" fill="#F0F7F5" stroke="#B0D0C5" stroke-width="1"/>
  <text x="1035" y="695" fill="#238377" font-size="11" text-anchor="middle">
    <tspan font-weight="700">关系示例：</tspan>
    <tspan>Principal 主导 Project　·　Person 协作 Project　·　KeyMatter 属于 Project　·　Group 围绕 Project　·　Resource 承载项目资料</tspan>
  </text>

  <g fill="none" stroke="#E3921F" stroke-width="2" marker-end="url(#arrow-orange)">
    <path d="M 730 887 H 790"/>
    <path d="M 1220 887 H 1280"/>
  </g>

  <g>
    <rect x="300" y="815" width="430" height="145" rx="16" fill="#FFF4E6" stroke="#E3921F" stroke-width="1.2"/>
    <text x="325" y="854" class="action-title">Todo</text>
    <text x="325" y="898" class="action-line"><tspan class="card-key">内容：</tspan><tspan>当前图没有展示六类实体的具体内容</tspan></text>
    <text x="325" y="929" class="action-line"><tspan class="card-key">关联：</tspan><tspan>KeyMatter / 讲清两层区别</tspan></text>

    <rect x="790" y="815" width="430" height="145" rx="16" fill="#FFF4E6" stroke="#E3921F" stroke-width="1.6"/>
    <text x="815" y="854" class="action-title">Task</text>
    <text x="815" y="898" class="action-line"><tspan class="card-key">目标：</tspan><tspan>为六类实体补一套完整示例</tspan></text>
    <text x="815" y="929" class="action-line"><tspan class="card-key">背景：</tspan><tspan>Project / Jarvis + Resource / 飞书文章</tspan></text>

    <rect x="1280" y="815" width="490" height="145" rx="16" fill="#D4F0D8" stroke="#4AAE5C" stroke-width="1.2"/>
    <text x="1305" y="854" class="action-title">ExecutionRun</text>
    <text x="1305" y="898" class="action-success"><tspan font-weight="600">过程：</tspan><tspan>读取 v2 → 填写示例 → 生成 v3</tspan></text>
    <text x="1305" y="929" class="action-success"><tspan font-weight="600">结果：</tspan><tspan>本地预览，等待确认后再写回</tspan></text>
  </g>
</svg>
