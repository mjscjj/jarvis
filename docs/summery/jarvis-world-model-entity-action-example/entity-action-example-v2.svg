<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="980" viewBox="0 0 1760 980">
  <defs>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6A9F91"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7AA0C0"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E3921F"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .title { fill: #1A3A3A; font-size: 26px; font-weight: 700; }
      .subtitle { fill: #5A7A7A; font-size: 14px; }
      .lane-title { fill: #1A3A3A; font-size: 17px; font-weight: 700; text-anchor: middle; }
      .lane-subtitle { fill: #5A7A7A; font-size: 11px; text-anchor: middle; }
      .lane-question { fill: #238377; font-size: 11px; text-anchor: middle; }
      .node-title { fill: #1A3A3A; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .node-title-strong { fill: #1A3A3A; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .node-body { fill: #5A7A7A; font-size: 11px; text-anchor: middle; }
      .node-body-success { fill: #368545; font-size: 11px; text-anchor: middle; }
      .edge-label { fill: #238377; font-size: 10px; text-anchor: middle; }
      .cross-label { fill: #5E7C76; font-size: 10px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1760" height="980" fill="#FFFFFF"/>

  <text x="80" y="58" class="title">一个真实例子：我们正在补这张“实体层 × 行动层”图</text>
  <text x="80" y="96" class="subtitle">同一件工作：在实体层是长期背景，在行动层是一次有始有终的任务</text>

  <g transform="translate(1112 123)">
    <circle cx="0" cy="0" r="5" fill="#54B49D"/>
    <text x="13" y="4" class="subtitle" font-size="11">长期实体</text>
    <circle cx="112" cy="0" r="5" fill="#E3921F"/>
    <text x="125" y="4" class="subtitle" font-size="11">实时行动</text>
    <line x1="225" y1="0" x2="258" y2="0" stroke="#7AA0C0" stroke-width="1.4" stroke-dasharray="6 6"/>
    <text x="270" y="4" class="subtitle" font-size="11">行动引用实体</text>
  </g>

  <rect x="80" y="155" width="1600" height="430" rx="18" fill="#F2FBF8" stroke="#B0D0C5" stroke-width="1.2"/>
  <rect x="80" y="620" width="1600" height="300" rx="18" fill="#FBF7F1" stroke="#E3921F" stroke-width="1.2"/>
  <line x1="265" y1="175" x2="265" y2="565" stroke="#B0D0C5" stroke-width="1.2"/>
  <line x1="265" y1="640" x2="265" y2="900" stroke="#E3921F" stroke-width="1.2"/>

  <text x="170" y="252" class="lane-title">长期实体层</text>
  <text x="170" y="276" class="lane-subtitle">稳定坐标 · 持续存在</text>
  <text x="170" y="356" class="lane-question">回答：这个世界里</text>
  <text x="170" y="374" class="lane-question">长期存在什么？</text>

  <text x="170" y="697" class="lane-title">实时行动层</text>
  <text x="170" y="721" class="lane-subtitle">短暂轨迹 · 完成后归档</text>
  <text x="170" y="796" class="lane-question">回答：此刻正在</text>
  <text x="170" y="814" class="lane-question">改变什么？</text>

  <g fill="none" stroke="#6A9F91" stroke-width="1.4" marker-end="url(#arrow-mint)" stroke-linejoin="round">
    <path d="M 425 300 V 240 H 1065 V 290"/>
    <path d="M 860 355 H 930"/>
    <path d="M 1200 350 H 1235 V 355 H 1270"/>
  </g>
  <text x="745" y="232" class="edge-label">主导</text>
  <text x="895" y="346" class="edge-label">属于</text>
  <text x="1235" y="346" class="edge-label">沉淀于</text>

  <g fill="none" stroke="#7AA0C0" stroke-width="1.4" stroke-dasharray="7 7" marker-end="url(#arrow-blue)" stroke-linejoin="round">
    <path d="M 425 410 V 680"/>
    <path d="M 740 410 V 680"/>
    <path d="M 1065 410 V 680"/>
    <path d="M 1430 410 V 680"/>
  </g>
  <rect x="393" y="590" width="64" height="24" rx="12" fill="#FFFFFF"/>
  <rect x="702" y="590" width="76" height="24" rx="12" fill="#FFFFFF"/>
  <rect x="1027" y="590" width="76" height="24" rx="12" fill="#FFFFFF"/>
  <rect x="1392" y="590" width="76" height="24" rx="12" fill="#FFFFFF"/>
  <text x="425" y="606" class="cross-label">委托人</text>
  <text x="740" y="606" class="cross-label">问题落点</text>
  <text x="1065" y="606" class="cross-label">目标归属</text>
  <text x="1430" y="606" class="cross-label">操作对象</text>

  <g fill="none" stroke="#E3921F" stroke-width="2" marker-end="url(#arrow-orange)">
    <path d="M 550 735 H 620"/>
    <path d="M 860 735 H 930"/>
    <path d="M 1200 735 H 1270"/>
  </g>

  <g>
    <rect x="300" y="300" width="250" height="110" rx="16" fill="#E0F5F0" stroke="#54B49D" stroke-width="1.2"/>
    <text x="425" y="345" class="node-title">Principal · 你</text>
    <text x="425" y="374" class="node-body">文章的委托人和最终决策者</text>

    <rect x="620" y="300" width="240" height="110" rx="16" fill="#E0F5F0" stroke="#54B49D" stroke-width="1.2"/>
    <text x="740" y="345" class="node-title">KeyMatter · 讲清两层区别</text>
    <text x="740" y="374" class="node-body">文章当前要解决的重点</text>

    <rect x="930" y="290" width="270" height="120" rx="16" fill="#CCF0E8" stroke="#2A9D8F" stroke-width="2"/>
    <text x="1065" y="334" class="node-title-strong">Project · 主动式数字分身文章</text>
    <text x="1065" y="368" class="node-body">持续完善的长期写作项目</text>

    <rect x="1270" y="300" width="320" height="110" rx="16" fill="#E0F5F0" stroke="#54B49D" stroke-width="1.2"/>
    <text x="1430" y="345" class="node-title">Resource · 飞书“世界建模”章节</text>
    <text x="1430" y="374" class="node-body">承载正文与两张配图的资料</text>
  </g>

  <g>
    <rect x="300" y="680" width="250" height="110" rx="16" fill="#E8F0ED" stroke="#71AF9D" stroke-width="1.2"/>
    <text x="425" y="725" class="node-title">你提出新要求</text>
    <text x="425" y="754" class="node-body">“给一个例子”</text>

    <rect x="620" y="680" width="240" height="110" rx="16" fill="#FFF4E6" stroke="#E3921F" stroke-width="1.2"/>
    <text x="740" y="725" class="node-title-strong">Todo</text>
    <text x="740" y="754" class="node-body">发现：当前图仍偏抽象</text>

    <rect x="930" y="680" width="270" height="110" rx="16" fill="#FFF4E6" stroke="#E3921F" stroke-width="1.6"/>
    <text x="1065" y="716" class="node-title-strong">Task</text>
    <text x="1065" y="746" class="node-body">给“世界建模”章节</text>
    <text x="1065" y="766" class="node-body">补一张真实案例图</text>

    <rect x="1270" y="680" width="320" height="110" rx="16" fill="#D4F0D8" stroke="#4AAE5C" stroke-width="1.2"/>
    <text x="1430" y="725" class="node-title-strong">ExecutionRun</text>
    <text x="1430" y="746" class="node-body-success">读取 v1 → 改成当前案例</text>
    <text x="1430" y="766" class="node-body-success">校验 → 给你预览</text>
  </g>

  <rect x="300" y="840" width="1290" height="48" rx="14" fill="#F2FAF3" stroke="#4AAE5C" stroke-width="1"/>
  <text x="945" y="870" fill="#368545" font-size="12" text-anchor="middle">
    <tspan font-weight="700">完成后：</tspan>
    <tspan>Todo / Task / ExecutionRun 进入历史；文章、重点和章节仍作为实体存在，结果成为新的 Fact / Summary。</tspan>
  </text>
</svg>
