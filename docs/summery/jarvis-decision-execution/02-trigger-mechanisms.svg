<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="#0f172a">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
    <marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#f97316"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.muted{fill:#64748b}.small{font-size:20px}.body{font-size:24px}.label{font-size:23px;font-weight:650}.title{font-size:29px;font-weight:750}.section{font-size:22px;font-weight:700}.pill{font-size:20px;font-weight:650}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#f8fafc"/>
  <circle cx="1800" cy="140" r="260" fill="#ffedd5" opacity="0.62"/>
  <text x="70" y="84" font-size="48" font-weight="800">什么触发一次思考</text>
  <text x="72" y="126" class="body muted">触发不是“来了一条消息”，而是出现了一个值得启动或恢复的未闭环目标</text>
  <rect x="1495" y="54" width="355" height="58" rx="29" fill="#ffffff" stroke="#fdba74"/>
  <circle cx="1532" cy="83" r="9" fill="#f97316"/><text x="1555" y="91" class="pill">五种入口，汇入同一个 M5 决策内核</text>

  <!-- Left trigger cards -->
  <g filter="url(#shadow)">
    <rect x="70" y="190" width="420" height="132" rx="22" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="70" y="344" width="420" height="132" rx="22" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="70" y="498" width="420" height="132" rx="22" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="70" y="652" width="420" height="132" rx="22" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="70" y="806" width="420" height="132" rx="22" fill="#fff7ed" stroke="#fb923c"/>
  </g>
  <circle cx="116" cy="236" r="24" fill="#f97316"/><text x="116" y="244" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">1</text>
  <text x="156" y="237" class="title">现实世界发生变化</text><text x="156" y="274" class="body">消息 · 日程 · 文档 · 代码变化</text><text x="156" y="304" class="small muted">原始事实进入统一线索入口</text>
  <circle cx="116" cy="390" r="24" fill="#f97316"/><text x="116" y="398" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">2</text>
  <text x="156" y="391" class="title">Principal 直接交办</text><text x="156" y="428" class="body">手工 Task · API · 明确指令</text><text x="156" y="458" class="small muted">无需经过来源专用流程</text>
  <circle cx="116" cy="544" r="24" fill="#f97316"/><text x="116" y="552" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">3</text>
  <text x="156" y="545" class="title">时间或等待条件到达</text><text x="156" y="582" class="small">ScheduledTask · yield-until · cron</text><text x="156" y="612" class="small muted">恢复同一个 Task，而不是重新立项</text>
  <circle cx="116" cy="698" r="24" fill="#f97316"/><text x="116" y="706" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">4</text>
  <text x="156" y="699" class="title">主动巡视发现未闭环</text><text x="156" y="736" class="body">世界变化 · 旧承诺 · 风险 · 机会</text><text x="156" y="766" class="small muted">Proactive 只发现，外部行动仍建普通 Task</text>
  <circle cx="116" cy="852" r="24" fill="#f97316"/><text x="116" y="860" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">5</text>
  <text x="156" y="853" class="title">人的补充或授权结果</text><text x="156" y="890" class="body">supplement · approve · reject</text><text x="156" y="920" class="small muted">原 Task 续跑；批准后进入 fresh apply run</text>

  <!-- Middle paths -->
  <rect x="570" y="184" width="530" height="760" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="608" y="228" class="section" fill="#475569">触发如何变成可执行工作</text>

  <rect x="610" y="266" width="450" height="150" rx="22" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="638" y="304" class="title">新线索路径</text>
  <rect x="638" y="330" width="98" height="52" rx="13" fill="#fff7ed"/><text x="687" y="364" text-anchor="middle" class="pill">M2 保存</text>
  <path d="M748 356 L790 356" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="803" y="330" width="108" height="52" rx="13" fill="#eff6ff"/><text x="857" y="364" text-anchor="middle" class="pill">M3 准入</text>
  <path d="M923 356 L965 356" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="978" y="330" width="60" height="52" rx="13" fill="#f1f5f9"/><text x="1008" y="364" text-anchor="middle" class="pill">Task</text>

  <rect x="610" y="442" width="450" height="120" rx="22" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="638" y="480" class="title">直接交办路径</text><text x="638" y="523" class="body">原始指令与证据 → 普通 Task</text>

  <rect x="610" y="588" width="450" height="120" rx="22" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="638" y="626" class="title">恢复路径</text><text x="638" y="669" class="body">时间 / supplement → 恢复同一 Session</text>

  <rect x="610" y="734" width="450" height="174" rx="22" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="638" y="772" class="title">审批路径</text>
  <text x="638" y="814" class="body">驳回 → 停止或改判</text>
  <text x="638" y="852" class="body">批准 → fresh apply run</text>
  <text x="638" y="884" class="small muted">已批准内容是确定输入，新增副作用仍需重新判断</text>

  <!-- Lines from triggers -->
  <path d="M490 256 C535 256 550 330 610 342" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#orange)"/>
  <path d="M490 410 C550 410 550 500 610 500" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#orange)"/>
  <path d="M490 564 C550 564 550 648 610 648" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#orange)"/>
  <path d="M490 718 C535 718 550 510 610 510" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#orange)"/>
  <path d="M490 872 C550 872 550 820 610 820" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#orange)"/>

  <!-- Decision gate and M5 -->
  <path d="M1100 564 L1180 564" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1198" y="218" width="652" height="690" rx="34" fill="#ffffff" stroke="#8b5cf6" stroke-width="3" filter="url(#shadow)"/>
  <text x="1238" y="266" class="section" fill="#6d28d9">真正的思考入口</text>
  <rect x="1238" y="294" width="572" height="146" rx="24" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="1524" y="343" text-anchor="middle" font-size="34" font-weight="800" fill="#5b21b6">M5 run 开始或恢复</text>
  <text x="1524" y="385" text-anchor="middle" class="body">面对一个未闭环目标，装载当前世界并选择下一步</text>
  <text x="1524" y="417" text-anchor="middle" class="small muted">同一个决策内核，不按来源分叉</text>

  <text x="1238" y="492" class="title">开始后并非照着触发内容执行</text>
  <g class="body">
    <circle cx="1254" cy="536" r="6" fill="#7c3aed"/><text x="1274" y="544">核验线索是否已经完成、失效或重复</text>
    <circle cx="1254" cy="584" r="6" fill="#7c3aed"/><text x="1274" y="592">还原 Principal 真正需要的现实结果</text>
    <circle cx="1254" cy="632" r="6" fill="#7c3aed"/><text x="1274" y="640">根据新证据持续改判，而非执行固定计划</text>
    <circle cx="1254" cy="680" r="6" fill="#7c3aed"/><text x="1274" y="688">可以行动，也可以调查、等待、询问或停止</text>
  </g>
  <rect x="1238" y="736" width="572" height="120" rx="20" fill="#0f172a"/>
  <text x="1524" y="780" text-anchor="middle" class="label" fill="#ffffff">原始事件 ≠ 思考本身</text>
  <text x="1524" y="820" text-anchor="middle" class="body" fill="#cbd5e1">事件只是唤醒条件；思考从“这个目标现在该怎么办”开始</text>

  <rect x="70" y="980" width="1780" height="62" rx="18" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="960" y="1020" text-anchor="middle" class="label" fill="#92400e">队列、cron 和补偿扫描负责“别漏掉”；是否值得推进、如何推进，仍由 Agent 根据当前世界判断</text>
</svg>
