<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="#0f172a">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/></marker>
    <marker id="green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#059669"/></marker>
    <marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#f97316"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}
      .muted{fill:#64748b}.small{font-size:18px}.body{font-size:21px}.label{font-size:22px;font-weight:650}.title{font-size:27px;font-weight:760}.section{font-size:20px;font-weight:700}.pill{font-size:18px;font-weight:650}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <circle cx="1785" cy="92" r="250" fill="#ede9fe" opacity="0.64"/>
  <circle cx="80" cy="1040" r="250" fill="#dbeafe" opacity="0.52"/>

  <text x="70" y="78" font-size="46" font-weight="800">Jarvis 执行流程全景</text>
  <text x="72" y="118" class="body muted">从现实变化形成线索，经 M3 准入后，由 M5 持续组装上下文、调查、判断、执行与验证</text>
  <rect x="1458" y="48" width="390" height="58" rx="29" fill="#ffffff" stroke="#c4b5fd"/>
  <circle cx="1494" cy="77" r="9" fill="#7c3aed"/>
  <text x="1517" y="85" class="pill">线索只是起点，真实结果才是终点</text>

  <!-- Discovery and admission -->
  <rect x="70" y="160" width="1780" height="250" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="94" y="180" width="158" height="38" rx="19" fill="#fff7ed" stroke="#fdba74"/>
  <text x="173" y="205" text-anchor="middle" class="section" fill="#c2410c">A · 发现与准入</text>

  <rect x="100" y="236" width="280" height="142" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <circle cx="136" cy="272" r="20" fill="#ffedd5" stroke="#fb923c"/>
  <text x="136" y="279" text-anchor="middle" class="pill">1</text>
  <text x="168" y="281" class="title">现实变化</text>
  <text x="128" y="320" class="body">消息 · 日程 · 文档 · 代码</text>
  <text x="128" y="350" class="small muted">时间到达 · 主动巡视 · 人的介入</text>

  <path d="M380 307 L432 307" stroke="#f97316" stroke-width="4" marker-end="url(#orange)"/>

  <rect x="450" y="236" width="300" height="142" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="486" cy="272" r="20" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="486" y="279" text-anchor="middle" class="pill">2</text>
  <text x="518" y="281" class="title">M2 · 原样采集</text>
  <text x="478" y="320" class="body">保存原文、来源与外部幂等键</text>
  <text x="478" y="350" class="small muted">形成中立线索，不解释、不下结论</text>

  <path d="M750 307 L802 307" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="820" y="226" width="330" height="162" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="856" cy="264" r="20" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="856" y="271" text-anchor="middle" class="pill">3</text>
  <text x="888" y="273" class="title" fill="#1d4ed8">M3 · 线索准入筛选</text>
  <text x="850" y="312" class="body">相关吗 · 未闭环吗 · 需要介入吗</text>
  <text x="850" y="342" class="small muted">证据足够就停止；不做执行方案</text>
  <rect x="850" y="354" width="92" height="26" rx="13" fill="#dcfce7"/><text x="896" y="373" text-anchor="middle" class="small">extracted</text>
  <rect x="950" y="354" width="92" height="26" rx="13" fill="#fef3c7"/><text x="996" y="373" text-anchor="middle" class="small">observing</text>
  <rect x="1050" y="354" width="70" height="26" rx="13" fill="#e2e8f0"/><text x="1085" y="373" text-anchor="middle" class="small">不输出</text>

  <path d="M1150 307 L1202 307" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>

  <rect x="1220" y="236" width="280" height="142" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="1256" cy="272" r="20" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="1256" y="279" text-anchor="middle" class="pill">4</text>
  <text x="1288" y="281" class="title">Todo → Task</text>
  <text x="1248" y="320" class="body">Materializer 机械固化</text>
  <text x="1248" y="347" class="small muted">幂等创建，保留等待、审批</text>
  <text x="1248" y="371" class="small muted">与恢复能力</text>

  <rect x="1550" y="236" width="270" height="142" rx="20" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="1685" y="274" text-anchor="middle" class="label" fill="#92400e">Task 是开放目标</text>
  <text x="1685" y="310" text-anchor="middle" class="body">上游内容是线索</text>
  <text x="1685" y="340" text-anchor="middle" class="small muted">不是 M5 必须照做的执行合同</text>
  <path d="M1500 307 L1550 307" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>

  <!-- M5 decision and execution -->
  <rect x="70" y="446" width="1780" height="410" rx="30" fill="#faf5ff" stroke="#8b5cf6" stroke-width="3"/>
  <rect x="96" y="466" width="330" height="42" rx="21" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="261" y="494" text-anchor="middle" class="section" fill="#6d28d9">B · M5 决策与执行内核</text>
  <text x="1810" y="494" text-anchor="end" class="pill" fill="#6d28d9">同一个 Agent 在每轮关键证据后重新选择下一步</text>

  <path d="M1360 378 L1360 424 L254 424 L254 535" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#purple)"/>
  <rect x="706" y="407" width="202" height="34" rx="17" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="807" y="430" text-anchor="middle" class="small" fill="#6d28d9">Task 唤醒 M5 执行</text>

  <!-- Step 1 -->
  <rect x="104" y="536" width="300" height="252" rx="22" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="142" cy="574" r="22" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="142" y="582" text-anchor="middle" class="label">1</text>
  <text x="180" y="583" class="title" fill="#6d28d9">组装上下文</text>
  <text x="132" y="624" class="label">业务证据</text>
  <text x="132" y="654" class="small mono">source_payload · 冻结上下文</text>
  <text x="132" y="682" class="small mono">当前世界 · 历史运行</text>
  <text x="132" y="720" class="label">可信指令</text>
  <text x="132" y="750" class="small">工作规则 · 审批策略 · Skills · 记忆</text>

  <path d="M404 662 L442 662" stroke="#7c3aed" stroke-width="4" marker-end="url(#purple)"/>

  <!-- Step 2 -->
  <rect x="460" y="536" width="300" height="252" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="498" cy="574" r="22" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="498" y="582" text-anchor="middle" class="label">2</text>
  <text x="536" y="583" class="title" fill="#1d4ed8">深入调查</text>
  <text x="488" y="628" class="body">沿消息、文档、数据和代码追证据</text>
  <text x="488" y="664" class="body">查询实体 Summary 与 Fact</text>
  <text x="488" y="700" class="body">组合工具与 Skills</text>
  <text x="488" y="736" class="small muted">可派只读子 Agent 并行取证</text>

  <path d="M760 662 L798 662" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>

  <!-- Step 3 -->
  <rect x="816" y="536" width="300" height="252" rx="22" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="854" cy="574" r="22" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="854" y="582" text-anchor="middle" class="label">3</text>
  <text x="892" y="583" class="title" fill="#6d28d9">判断</text>
  <text x="844" y="628" class="body">真实目标现在还成立吗</text>
  <text x="844" y="664" class="body">当前最合理的下一步是什么</text>
  <text x="844" y="700" class="body">副作用是否需要审批</text>
  <text x="844" y="736" class="small muted">也可以等待、询问、观察或停止</text>

  <path d="M1116 662 L1154 662" stroke="#7c3aed" stroke-width="4" marker-end="url(#purple)"/>

  <!-- Step 4 -->
  <rect x="1172" y="536" width="300" height="252" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <circle cx="1210" cy="574" r="22" fill="#d1fae5" stroke="#34d399"/>
  <text x="1210" y="582" text-anchor="middle" class="label">4</text>
  <text x="1248" y="583" class="title" fill="#047857">执行</text>
  <text x="1200" y="628" class="body">无需审批：直接做到真实完成</text>
  <text x="1200" y="664" class="body">需要审批：暂停并保存方案</text>
  <text x="1200" y="700" class="body">调用工具改变外部世界</text>
  <text x="1200" y="736" class="small muted">每个真实副作用写入 effects 台账</text>

  <path d="M1472 662 L1510 662" stroke="#059669" stroke-width="4" marker-end="url(#green)"/>

  <!-- Step 5 -->
  <rect x="1528" y="536" width="288" height="252" rx="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="1566" cy="574" r="22" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1566" y="582" text-anchor="middle" class="label">5</text>
  <text x="1604" y="583" class="title" fill="#b45309">验证</text>
  <text x="1556" y="628" class="body">结果真实存在吗</text>
  <text x="1556" y="664" class="body">读回、测试或投递成功吗</text>
  <text x="1556" y="700" class="body">是否满足原始目标</text>
  <text x="1556" y="736" class="small muted">工具成功是证据，不等于完成</text>

  <!-- Replan loop -->
  <path d="M1672 788 C1672 830 610 836 610 788" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
  <rect x="848" y="802" width="592" height="36" rx="18" fill="#dbeafe"/>
  <text x="1144" y="826" text-anchor="middle" class="pill" fill="#1d4ed8">验证不成立 / 新事实出现 → 回到调查与判断，重新规划</text>

  <!-- Feedback and resumption -->
  <rect x="70" y="882" width="1780" height="126" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="94" y="900" width="630" height="88" rx="18" fill="#fff7ed" stroke="#fdba74"/>
  <text x="124" y="932" class="label" fill="#c2410c">等待 / 审批 / 人工补充</text>
  <text x="124" y="962" class="small">定时唤醒、批准结果或人工补充到达</text>
  <text x="124" y="985" class="small">→ 恢复同一个 Task → 重新组装当前上下文</text>
  <path d="M410 900 C410 866 254 866 254 788" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#orange)"/>

  <rect x="752" y="900" width="1074" height="88" rx="18" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="782" y="932" class="label" fill="#047857">真实结果写回世界状态</text>
  <text x="782" y="964" class="body">ExecutionRun / Task / effects → FactEngine → Summary 与 Fact → 下一轮 current_world</text>
  <path d="M1672 788 C1672 870 1570 876 1518 900" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#green)"/>
  <path d="M1000 900 C860 866 284 866 284 788" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#blue)"/>

  <!-- Machine substrate -->
  <rect x="70" y="1024" width="1780" height="40" rx="20" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="960" y="1051" text-anchor="middle" class="pill" fill="#475569">确定性机器底座：持久化状态 · Coordinator 唤醒 · 幂等与去重 · 等待 / 恢复 · 审批入口 · 事件与 effects 审计</text>
</svg>
