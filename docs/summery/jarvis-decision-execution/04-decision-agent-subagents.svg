<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="#0f172a">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.11"/></filter>
    <marker id="purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/></marker>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#059669"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.muted{fill:#64748b}.small{font-size:20px}.body{font-size:24px}.label{font-size:23px;font-weight:650}.title{font-size:30px;font-weight:760}.section{font-size:22px;font-weight:700}.pill{font-size:20px;font-weight:650}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#f8fafc"/>
  <circle cx="1750" cy="970" r="280" fill="#dcfce7" opacity="0.55"/><circle cx="120" cy="140" r="250" fill="#ede9fe" opacity="0.55"/>
  <text x="70" y="84" font-size="48" font-weight="800">决策 Agent 与执行子 Agent：中心判断、外围并行</text>
  <text x="72" y="126" class="body muted">子 Agent 下放的是素材劳动，不是目标、授权和完成判断</text>
  <rect x="1460" y="54" width="390" height="58" rx="29" fill="#ffffff" stroke="#c4b5fd"/><circle cx="1496" cy="83" r="9" fill="#7c3aed"/><text x="1519" y="91" class="pill">可以下放劳动，不能下放最终判断权</text>

  <!-- Central decision agent -->
  <rect x="610" y="222" width="700" height="610" rx="38" fill="#ffffff" stroke="#8b5cf6" stroke-width="4" filter="url(#shadow)"/>
  <rect x="610" y="222" width="700" height="92" rx="38" fill="#5b21b6"/><rect x="610" y="268" width="700" height="46" fill="#5b21b6"/>
  <text x="650" y="278" class="title" fill="#ffffff">M5 · 决策 Agent</text>
  <text x="1270" y="278" text-anchor="end" class="pill" fill="#ddd6fe">唯一持有完整 TASK_CONTEXT</text>

  <text x="650" y="365" class="section" fill="#6d28d9">不可下放的四项权力</text>
  <g>
    <rect x="650" y="394" width="285" height="76" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/><text x="792" y="427" text-anchor="middle" class="label">确定真实目标</text><text x="792" y="456" text-anchor="middle" class="small muted">到底要解决什么现实问题</text>
    <rect x="985" y="394" width="285" height="76" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/><text x="1127" y="427" text-anchor="middle" class="label">调整范围与下一步</text><text x="1127" y="456" text-anchor="middle" class="small muted">新证据出现后持续重规划</text>
    <rect x="650" y="492" width="285" height="76" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/><text x="792" y="525" text-anchor="middle" class="label">判断副作用与审批</text><text x="792" y="554" text-anchor="middle" class="small muted">结合具体内容，而不是 action_type</text>
    <rect x="985" y="492" width="285" height="76" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/><text x="1127" y="525" text-anchor="middle" class="label">认定是否真正完成</text><text x="1127" y="554" text-anchor="middle" class="small muted">工具成功只是证据，不是结论</text>
  </g>

  <text x="650" y="620" class="section" fill="#6d28d9">它怎样使用子 Agent</text>
  <path d="M670 655 L1245 655" stroke="#ddd6fe" stroke-width="2"/>
  <text x="682" y="692" class="body">1. 把问题拆成互不依赖、可验证的调查分支</text>
  <text x="682" y="732" class="body">2. 给每个分支完整简报、范围、禁区和输出格式</text>
  <text x="682" y="772" class="body">3. 汇总二手结论，复核关键出处，再决定是否行动</text>

  <!-- Left subagents -->
  <rect x="70" y="236" width="430" height="180" rx="26" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="120" cy="286" r="23" fill="#2563eb"/><text x="120" y="294" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">A</text>
  <text x="158" y="294" class="title" fill="#1d4ed8">会话与文档调查</text>
  <text x="110" y="342" class="body">拉群聊、线程、飞书文档和历史决策</text>
  <text x="110" y="380" class="small muted">返回：结论 + 消息 / 文档链接</text>

  <rect x="70" y="454" width="430" height="180" rx="26" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="120" cy="504" r="23" fill="#2563eb"/><text x="120" y="512" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">B</text>
  <text x="158" y="512" class="title" fill="#1d4ed8">代码与仓库调查</text>
  <text x="110" y="560" class="body">扫代码、commit、MR、测试和运行证据</text>
  <text x="110" y="598" class="small muted">返回：结论 + commit / 文件路径</text>

  <rect x="70" y="672" width="430" height="180" rx="26" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="120" cy="722" r="23" fill="#2563eb"/><text x="120" y="730" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">C</text>
  <text x="158" y="730" class="title" fill="#1d4ed8">数据与事实调查</text>
  <text x="110" y="778" class="body">查表格、任务、实体页、Fact 和外部系统</text>
  <text x="110" y="816" class="small muted">返回：结论 + 可复查的数据位置</text>

  <!-- Arrows between M5 and subagents -->
  <path d="M610 378 C558 358 552 326 500 326" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#purple)"/>
  <path d="M500 362 C554 382 558 410 610 430" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
  <path d="M610 505 C558 505 552 544 500 544" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#purple)"/>
  <path d="M500 580 C554 580 558 555 610 555" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
  <path d="M610 675 C558 700 552 762 500 762" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#purple)"/>
  <path d="M500 798 C554 785 558 742 610 725" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
  <text x="512" y="304" class="small" fill="#6d28d9">有边界的简报</text>
  <text x="512" y="472" class="small" fill="#1d4ed8">结论 + 出处</text>

  <!-- Right action plane -->
  <rect x="1420" y="236" width="430" height="616" rx="30" fill="#ffffff" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="1456" y="282" class="section" fill="#047857">真实动作仍由 M5 负责</text>
  <rect x="1458" y="318" width="354" height="88" rx="18" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1635" y="353" text-anchor="middle" class="label">默认：子 Agent 只读</text>
  <text x="1635" y="383" text-anchor="middle" class="small muted">不发消息、不改文档、不提 MR</text>

  <path d="M1458 448 L1812 448" stroke="#d1fae5" stroke-width="2"/>
  <text x="1458" y="490" class="label">M5 自己执行</text>
  <text x="1458" y="530" class="body">发送、修改、创建、提交、等待</text>
  <text x="1458" y="570" class="body">记录 effects，验证真实结果</text>

  <rect x="1458" y="622" width="354" height="152" rx="20" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1486" y="660" class="label" fill="#6d28d9">唯一可下放的写操作</text>
  <text x="1486" y="700" class="body">apply 阶段已经批准、内容完全指定</text>
  <text x="1486" y="738" class="small muted">子 Agent 只代为落地，不得改实质内容</text>
  <path d="M1310 540 L1420 540" stroke="#059669" stroke-width="4" marker-end="url(#green)"/>

  <!-- Bottom constraints -->
  <rect x="70" y="920" width="1780" height="116" rx="26" fill="#0f172a"/>
  <text x="110" y="961" class="section" fill="#ffffff">子 Agent 边界</text>
  <text x="110" y="1005" class="body" fill="#cbd5e1">看不到完整 TASK_CONTEXT，必须收到自足简报 · 默认只读 · 不再派生子 Agent · 二手结论没有出处就视为待验证假设</text>
</svg>
