<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="#0f172a">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#059669"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.muted{fill:#64748b}.small{font-size:20px}.body{font-size:24px}.label{font-size:23px;font-weight:650}.title{font-size:29px;font-weight:750}.section{font-size:22px;font-weight:700}.pill{font-size:20px;font-weight:650}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#f8fafc"/>
  <circle cx="1790" cy="100" r="250" fill="#dbeafe" opacity="0.55"/><circle cx="100" cy="1020" r="260" fill="#dcfce7" opacity="0.45"/>
  <text x="70" y="84" font-size="48" font-weight="800">世界上下文、规则与记忆：一次 M5 run 如何被组装</text>
  <text x="72" y="126" class="body muted">可信指令、业务证据和机器边界分层进入；执行结果再分层写回</text>
  <rect x="1510" y="54" width="340" height="58" rx="29" fill="#ffffff" stroke="#93c5fd"/><circle cx="1546" cy="83" r="9" fill="#2563eb"/><text x="1569" y="91" class="pill">记忆不是一个无限续跑的 Session</text>

  <!-- Left input planes -->
  <rect x="70" y="188" width="610" height="220" rx="28" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="106" y="232" class="section" fill="#b45309">A. 可信控制平面 · 怎样判断</text>
  <g class="pill">
    <rect x="106" y="260" width="156" height="52" rx="14" fill="#ffffff" stroke="#fcd34d"/><text x="184" y="293" text-anchor="middle">System Prompt</text>
    <rect x="276" y="260" width="140" height="52" rx="14" fill="#ffffff" stroke="#fcd34d"/><text x="346" y="293" text-anchor="middle">阶段工作规则</text>
    <rect x="430" y="260" width="140" height="52" rx="14" fill="#ffffff" stroke="#fcd34d"/><text x="500" y="293" text-anchor="middle">审批策略</text>
    <rect x="106" y="328" width="156" height="52" rx="14" fill="#ffffff" stroke="#fcd34d"/><text x="184" y="361" text-anchor="middle">Shared Memory</text>
    <rect x="276" y="328" width="140" height="52" rx="14" fill="#ffffff" stroke="#fcd34d"/><text x="346" y="361" text-anchor="middle">Skills</text>
    <rect x="430" y="328" width="210" height="52" rx="14" fill="#ffffff" stroke="#fcd34d"/><text x="535" y="361" text-anchor="middle">工具目录与阶段说明</text>
  </g>

  <rect x="70" y="438" width="610" height="374" rx="28" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="106" y="482" class="section" fill="#1d4ed8">B. 业务证据平面 · 世界发生了什么</text>
  <g>
    <rect x="106" y="510" width="250" height="74" rx="16" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="231" y="540" text-anchor="middle" class="label mono">source_payload</text><text x="231" y="568" text-anchor="middle" class="small muted">来源原始语义 · 线索不是合同</text>
    <rect x="382" y="510" width="258" height="74" rx="16" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="511" y="540" text-anchor="middle" class="label mono">execution_context</text><text x="511" y="568" text-anchor="middle" class="small muted">M3 冻结快照 · 创建时的世界</text>
    <rect x="106" y="602" width="250" height="74" rx="16" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="231" y="632" text-anchor="middle" class="label mono">current_world</text><text x="231" y="660" text-anchor="middle" class="small muted">本轮实时 Task / Todo 摘要</text>
    <rect x="382" y="602" width="258" height="74" rx="16" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="511" y="632" text-anchor="middle" class="label mono">previous_runs</text><text x="511" y="660" text-anchor="middle" class="small muted">同一 Task 已发生的执行</text>
    <rect x="106" y="694" width="250" height="74" rx="16" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="231" y="724" text-anchor="middle" class="label mono">supplements</text><text x="231" y="752" text-anchor="middle" class="small muted">执行期可信补充指示</text>
    <rect x="382" y="694" width="258" height="74" rx="16" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="511" y="724" text-anchor="middle" class="label">按需下钻</text><text x="511" y="752" text-anchor="middle" class="small muted">实体 Summary / Fact / 外部系统</text>
  </g>

  <rect x="70" y="842" width="610" height="146" rx="28" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="106" y="884" class="section" fill="#475569">C. 机器边界平面 · 什么必须确定</text>
  <text x="106" y="926" class="body">Task 状态 · 幂等 · 等待 / 恢复 · 审批入口</text>
  <text x="106" y="962" class="body">事件流 · effects 留痕 · 输出协议 · 工具权限</text>

  <!-- Assembly arrows -->
  <path d="M680 298 C748 298 758 405 828 431" fill="none" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M680 626 L828 626" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
  <path d="M680 914 C750 914 758 822 828 798" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- M5 center -->
  <rect x="850" y="290" width="430" height="600" rx="38" fill="#ffffff" stroke="#8b5cf6" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="1065" cy="420" r="96" fill="#5b21b6"/>
  <text x="1065" y="408" text-anchor="middle" font-size="38" font-weight="800" fill="#ffffff">M5 run</text>
  <text x="1065" y="448" text-anchor="middle" class="pill" fill="#ddd6fe">当前这一轮世界观投影</text>
  <text x="1065" y="563" text-anchor="middle" class="title" fill="#6d28d9">理解 → 调查 → 决策</text>
  <text x="1065" y="608" text-anchor="middle" class="title" fill="#6d28d9">行动 → 验证 → 改判</text>
  <rect x="900" y="662" width="330" height="138" rx="22" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1065" y="703" text-anchor="middle" class="label">渐进式披露</text>
  <text x="1065" y="740" text-anchor="middle" class="body">默认给摘要；需要时再查细节</text>
  <text x="1065" y="773" text-anchor="middle" class="small muted">冻结背景不重装，当前事实按需读取</text>

  <!-- Right writeback / memory -->
  <path d="M1280 590 L1370 590" stroke="#059669" stroke-width="5" marker-end="url(#green)"/>
  <rect x="1390" y="190" width="460" height="798" rx="32" fill="#ffffff" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="1428" y="236" class="section" fill="#047857">执行后怎样更新记忆</text>

  <rect x="1428" y="272" width="384" height="170" rx="22" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1458" y="312" class="title" fill="#047857">1. 任务记忆</text>
  <text x="1458" y="350" class="small">ExecutionRun / TaskEvent</text>
  <text x="1458" y="382" class="small">summary / progress_summary</text>
  <text x="1458" y="414" class="small muted">effects · 保证同一事项跨轮增量推进</text>

  <path d="M1620 442 L1620 478" stroke="#059669" stroke-width="3" marker-end="url(#green)"/>
  <rect x="1428" y="492" width="384" height="198" rx="22" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="1458" y="532" class="title" fill="#1d4ed8">2. 世界记忆</text>
  <text x="1458" y="570" class="small">Message / Todo / Task 成为新证据</text>
  <text x="1458" y="604" class="small">FactEngine 维护 Summary 与 Fact</text>
  <text x="1458" y="646" class="small muted">Summary：现在是什么</text>
  <text x="1458" y="676" class="small muted">Fact：发生过什么</text>

  <path d="M1620 690 L1620 726" stroke="#059669" stroke-width="3" marker-end="url(#green)"/>
  <rect x="1428" y="740" width="384" height="194" rx="22" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="1458" y="780" class="title" fill="#b45309">3. 行为记忆</text>
  <text x="1458" y="818" class="small">工作规则 / 审批策略</text>
  <text x="1458" y="850" class="small">Shared Memory</text>
  <text x="1458" y="882" class="small muted">沉淀稳定偏好、经验和行动边界</text>
  <text x="1458" y="912" class="small muted">它们是可信指令，不是业务事实</text>

  <!-- Feedback arrows -->
  <path d="M1390 580 C1338 572 1326 558 1280 542" fill="none" stroke="#059669" stroke-width="4"/>
  <path d="M1510 988 C1510 1014 440 1014 440 988" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
  <text x="960" y="1056" text-anchor="middle" class="pill" fill="#1d4ed8">下一轮从任务摘要与当前世界开始，按需读取更深历史；不是复用一段无限增长的对话</text>

  <rect x="850" y="930" width="430" height="58" rx="18" fill="#0f172a"/>
  <text x="1065" y="968" text-anchor="middle" class="pill" fill="#ffffff">程序保证边界；模型负责不确定语义</text>
</svg>
