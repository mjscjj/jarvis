<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="#0f172a">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.11"/></filter>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/></marker>
    <marker id="gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.muted{fill:#64748b}.small{font-size:20px}.body{font-size:24px}.label{font-size:23px;font-weight:650}.title{font-size:30px;font-weight:760}.section{font-size:22px;font-weight:700}.pill{font-size:20px;font-weight:650}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#f8fafc"/>
  <circle cx="120" cy="970" r="260" fill="#dbeafe" opacity="0.55"/><circle cx="1805" cy="130" r="260" fill="#ede9fe" opacity="0.6"/>
  <text x="70" y="84" font-size="48" font-weight="800">快脑与慢脑：同一个 Agent 的两种工作状态</text>
  <text x="72" y="126" class="body muted">区别不在模型大小，也不在流水线先后，而在动作是否可逆、是否会改变外部世界</text>
  <rect x="1515" y="54" width="335" height="58" rx="29" fill="#ffffff" stroke="#c4b5fd"/><circle cx="1551" cy="83" r="9" fill="#7c3aed"/><text x="1574" y="91" class="pill">快慢脑都在 M5 内部</text>

  <!-- M3 admission outside -->
  <rect x="70" y="224" width="330" height="580" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="104" y="270" class="section" fill="#475569">执行前的准入门</text>
  <rect x="104" y="310" width="262" height="116" rx="20" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="235" y="355" text-anchor="middle" class="title">M3</text>
  <text x="235" y="394" text-anchor="middle" class="small">值不值得启动一次完整执行</text>
  <text x="104" y="480" class="label">只做三件事</text>
  <text x="104" y="525" class="body">判断相关性与未闭环</text>
  <text x="104" y="568" class="body">识别完成、重复或观察</text>
  <text x="104" y="611" class="body">冻结准入时背景快照</text>
  <rect x="104" y="666" width="262" height="98" rx="18" fill="#fff7ed" stroke="#fdba74"/>
  <text x="235" y="706" text-anchor="middle" class="label" fill="#c2410c">它不是快脑</text>
  <text x="235" y="738" text-anchor="middle" class="small muted">不制定计划 · 不判审批 · 不执行</text>
  <path d="M400 515 L488 515" stroke="#64748b" stroke-width="4" marker-end="url(#gray)"/>

  <!-- M5 container -->
  <rect x="510" y="190" width="1340" height="680" rx="36" fill="#ffffff" stroke="#8b5cf6" stroke-width="3" filter="url(#shadow)"/>
  <rect x="510" y="190" width="1340" height="78" rx="36" fill="#0f172a"/><rect x="510" y="230" width="1340" height="38" fill="#0f172a"/>
  <text x="550" y="240" class="title" fill="#ffffff">M5 · 一个连续的决策循环</text>
  <text x="1810" y="240" text-anchor="end" class="pill" fill="#cbd5e1">每拿到一轮关键证据，就重新判断下一步</text>

  <!-- Fast brain -->
  <rect x="550" y="306" width="550" height="470" rx="28" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="610" cy="362" r="31" fill="#2563eb"/><text x="610" y="373" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">快</text>
  <text x="660" y="374" class="title" fill="#1d4ed8">安全调查与价值判断</text>
  <text x="590" y="427" class="body">先看摘要，再按需下钻事实与外部系统</text>

  <g>
    <rect x="590" y="466" width="212" height="66" rx="16" fill="#ffffff" stroke="#bfdbfe"/><text x="696" y="507" text-anchor="middle" class="label">理解线索</text>
    <rect x="828" y="466" width="212" height="66" rx="16" fill="#ffffff" stroke="#bfdbfe"/><text x="934" y="507" text-anchor="middle" class="label">还原真实目标</text>
    <rect x="590" y="552" width="212" height="66" rx="16" fill="#ffffff" stroke="#bfdbfe"/><text x="696" y="593" text-anchor="middle" class="label">查证当前现实</text>
    <rect x="828" y="552" width="212" height="66" rx="16" fill="#ffffff" stroke="#bfdbfe"/><text x="934" y="593" text-anchor="middle" class="label">选择下一步</text>
  </g>
  <rect x="590" y="656" width="450" height="82" rx="18" fill="#dbeafe"/>
  <text x="815" y="690" text-anchor="middle" class="label" fill="#1e40af">典型特征：可逆、只读、可反复</text>
  <text x="815" y="720" text-anchor="middle" class="small muted">事实不足就继续调查；不为收尾硬凑动作</text>

  <!-- Slow brain -->
  <rect x="1260" y="306" width="550" height="470" rx="28" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="1320" cy="362" r="31" fill="#7c3aed"/><text x="1320" y="373" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">慢</text>
  <text x="1370" y="374" class="title" fill="#6d28d9">具体动作与结果验证</text>
  <text x="1300" y="427" class="body">行动前判断边界，行动后核验现实结果</text>
  <g>
    <rect x="1300" y="466" width="212" height="66" rx="16" fill="#ffffff" stroke="#ddd6fe"/><text x="1406" y="507" text-anchor="middle" class="label">判断副作用</text>
    <rect x="1538" y="466" width="212" height="66" rx="16" fill="#ffffff" stroke="#ddd6fe"/><text x="1644" y="507" text-anchor="middle" class="label">审批或直接做</text>
    <rect x="1300" y="552" width="212" height="66" rx="16" fill="#ffffff" stroke="#ddd6fe"/><text x="1406" y="593" text-anchor="middle" class="label">调用工具执行</text>
    <rect x="1538" y="552" width="212" height="66" rx="16" fill="#ffffff" stroke="#ddd6fe"/><text x="1644" y="593" text-anchor="middle" class="label">验证真实结果</text>
  </g>
  <rect x="1300" y="656" width="450" height="82" rx="18" fill="#ede9fe"/>
  <text x="1525" y="690" text-anchor="middle" class="label" fill="#5b21b6">典型特征：产生副作用、需要留痕</text>
  <text x="1525" y="720" text-anchor="middle" class="small muted">工具成功不等于完成；结果不成立就重新判断</text>

  <!-- Transition gate -->
  <rect x="1094" y="422" width="172" height="190" rx="28" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="1180" y="462" text-anchor="middle" class="label" fill="#b45309">行动边界</text>
  <text x="1180" y="503" text-anchor="middle" class="small">事实够了吗</text>
  <text x="1180" y="538" text-anchor="middle" class="small">副作用清楚吗</text>
  <text x="1180" y="573" text-anchor="middle" class="small">需要审批吗</text>
  <path d="M1100 517 L1094 517" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
  <path d="M1266 517 L1260 517" stroke="#7c3aed" stroke-width="4" marker-end="url(#purple)"/>

  <!-- Feedback loops -->
  <path d="M1050 760 C1080 830 1280 830 1310 760" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#purple)"/>
  <text x="1180" y="836" text-anchor="middle" class="pill" fill="#6d28d9">边界清楚 → 行动</text>
  <path d="M1570 776 C1570 918 760 918 760 776" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
  <text x="1165" y="928" text-anchor="middle" class="pill" fill="#1d4ed8">验证失败、新事实出现或目标变化 → 回到快脑重新判断</text>

  <!-- Bottom thesis -->
  <rect x="70" y="968" width="1780" height="74" rx="22" fill="#0f172a"/>
  <text x="960" y="1016" text-anchor="middle" font-size="27" font-weight="720" fill="#ffffff">快慢不是两个 Agent，也不是两个固定阶段；它们是同一决策者在“可逆调查”与“现实行动”之间持续切换</text>
</svg>
