<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="#0f172a">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}
      .muted{fill:#64748b}.small{font-size:20px}.body{font-size:24px}.label{font-size:22px;font-weight:650}.cardTitle{font-size:29px;font-weight:750}.section{font-size:22px;font-weight:700;letter-spacing:1px}.pill{font-size:20px;font-weight:650}.step{font-size:22px;font-weight:650}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#f8fafc"/>
  <circle cx="1780" cy="100" r="250" fill="#ede9fe" opacity="0.55"/>
  <circle cx="90" cy="1010" r="280" fill="#dbeafe" opacity="0.45"/>

  <text x="70" y="82" font-size="48" font-weight="800">Agent 决策与执行 · 技术全景</text>
  <text x="72" y="124" class="body muted">世界变化触发一段持续判断；结果写回世界，成为下一次判断的起点</text>
  <rect x="1518" y="54" width="330" height="58" rx="29" fill="#ffffff" stroke="#c4b5fd"/>
  <circle cx="1554" cy="83" r="9" fill="#7c3aed"/>
  <text x="1576" y="91" class="pill">一个 Agent · 两种思考 · 一个闭环</text>

  <!-- Trigger layer -->
  <text x="70" y="185" class="section" fill="#c2410c">01 触发：什么让思考开始或继续</text>
  <g filter="url(#shadow)">
    <rect x="70" y="210" width="220" height="108" rx="20" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="310" y="210" width="220" height="108" rx="20" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="550" y="210" width="220" height="108" rx="20" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="790" y="210" width="220" height="108" rx="20" fill="#fff7ed" stroke="#fb923c"/>
  </g>
  <text x="180" y="252" text-anchor="middle" class="label">现实变化</text><text x="180" y="286" text-anchor="middle" class="small muted">消息 · 日程 · 文档 · 代码</text>
  <text x="420" y="252" text-anchor="middle" class="label">时间变化</text><text x="420" y="286" text-anchor="middle" class="small muted">定时 · 等待到期 · 恢复</text>
  <text x="660" y="252" text-anchor="middle" class="label">主动巡视</text><text x="660" y="286" text-anchor="middle" class="small muted">世界变化 · 未闭环事项</text>
  <text x="900" y="252" text-anchor="middle" class="label">人的介入</text><text x="900" y="286" text-anchor="middle" class="small muted">补充 · 批准 · 驳回</text>

  <!-- Control plane -->
  <rect x="1060" y="182" width="790" height="142" rx="24" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="1094" y="219" class="section" fill="#b45309">可信控制平面 · 决定“怎样判断”</text>
  <g>
    <rect x="1092" y="242" width="138" height="52" rx="14" fill="#fffbeb" stroke="#fcd34d"/><text x="1161" y="275" text-anchor="middle" class="pill">系统提示词</text>
    <rect x="1243" y="242" width="138" height="52" rx="14" fill="#fffbeb" stroke="#fcd34d"/><text x="1312" y="275" text-anchor="middle" class="pill">工作规则</text>
    <rect x="1394" y="242" width="138" height="52" rx="14" fill="#fffbeb" stroke="#fcd34d"/><text x="1463" y="275" text-anchor="middle" class="pill">审批策略</text>
    <rect x="1545" y="242" width="138" height="52" rx="14" fill="#fffbeb" stroke="#fcd34d"/><text x="1614" y="275" text-anchor="middle" class="pill">Skills / 工具</text>
    <rect x="1696" y="242" width="126" height="52" rx="14" fill="#fffbeb" stroke="#fcd34d"/><text x="1759" y="275" text-anchor="middle" class="pill">共享记忆</text>
  </g>

  <!-- Task shell -->
  <rect x="70" y="370" width="330" height="430" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="104" y="414" class="section" fill="#475569">02 任务壳 · 让工作可恢复</text>
  <rect x="102" y="452" width="266" height="80" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="128" y="484" class="label">M2 · 原样保存事实</text><text x="128" y="514" class="small muted">只采集，不解释、不判断</text>
  <path d="M235 532 L235 562" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="102" y="568" width="266" height="94" rx="16" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="128" y="602" class="label" fill="#1d4ed8">M3 · 低成本准入</text><text x="128" y="632" class="small muted">只判断是否值得启动 M5</text>
  <path d="M235 662 L235 692" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="102" y="698" width="266" height="72" rx="16" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="235" y="730" text-anchor="middle" class="label">Task · 等待 · 审批 · 恢复</text><text x="235" y="758" text-anchor="middle" class="small muted">程序保证状态与留痕</text>
  <rect x="96" y="815" width="278" height="44" rx="22" fill="#e2e8f0"/>
  <text x="235" y="844" text-anchor="middle" class="pill" fill="#475569">M3 不是快脑；它不制定执行方案</text>

  <!-- M5 core -->
  <rect x="455" y="370" width="930" height="430" rx="30" fill="#ffffff" stroke="#8b5cf6" stroke-width="3" filter="url(#shadow)"/>
  <rect x="455" y="370" width="930" height="74" rx="30" fill="#5b21b6"/>
  <rect x="455" y="414" width="930" height="30" fill="#5b21b6"/>
  <text x="493" y="417" font-size="31" font-weight="800" fill="#ffffff">03 M5 · 决策与执行内核</text>
  <text x="1346" y="416" text-anchor="end" class="pill" fill="#ddd6fe">真实目标、范围、审批与完成认定始终由它负责</text>

  <rect x="490" y="472" width="410" height="260" rx="24" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="522" y="512" class="cardTitle" fill="#1d4ed8">快脑 · 安全调查与价值判断</text>
  <text x="522" y="556" class="body">读取摘要 → 查证现实 → 排重</text>
  <text x="522" y="596" class="body">还原真实目标 → 选择下一步</text>
  <text x="522" y="640" class="small muted">可逆 · 默认只读 · 随证据持续改判</text>
  <rect x="522" y="671" width="340" height="42" rx="21" fill="#dbeafe"/>
  <text x="692" y="699" text-anchor="middle" class="pill" fill="#1e40af">事实还不够？继续调查，不急着行动</text>

  <rect x="942" y="472" width="408" height="260" rx="24" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="974" y="512" class="cardTitle" fill="#6d28d9">慢脑 · 具体动作与结果验证</text>
  <text x="974" y="556" class="body">判断副作用 → 必要时审批</text>
  <text x="974" y="596" class="body">调用工具 → 等待 / 恢复 → 验证</text>
  <text x="974" y="640" class="small muted">改变外部世界 · 结果不成立就回到快脑</text>
  <rect x="974" y="671" width="340" height="42" rx="21" fill="#ede9fe"/>
  <text x="1144" y="699" text-anchor="middle" class="pill" fill="#5b21b6">完成不是工具成功，而是现实结果成立</text>
  <path d="M900 582 C920 550 924 550 942 582" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <path d="M942 624 C922 656 918 656 900 624" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <rect x="744" y="744" width="354" height="42" rx="21" fill="#f3e8ff"/>
  <text x="921" y="772" text-anchor="middle" class="pill" fill="#6d28d9">调查 ⇄ 行动 ⇄ 验证，循环直到该停</text>

  <!-- Action plane -->
  <rect x="1440" y="370" width="410" height="430" rx="28" fill="#ffffff" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="1474" y="414" class="section" fill="#047857">04 能力与现实结果</text>
  <rect x="1474" y="454" width="342" height="72" rx="16" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1502" y="487" class="label">工具与 Skills</text><text x="1502" y="514" class="small muted">飞书 · 代码 · 数据 · 外部系统</text>
  <rect x="1474" y="544" width="342" height="72" rx="16" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1502" y="577" class="label">只读执行子 Agent</text><text x="1502" y="604" class="small muted">并行翻素材，返回结论与出处</text>
  <text x="1474" y="660" class="label">合法结果不是只有“做完”</text>
  <g class="small">
    <rect x="1474" y="680" width="102" height="42" rx="12" fill="#dcfce7"/><text x="1525" y="708" text-anchor="middle">完成</text>
    <rect x="1588" y="680" width="102" height="42" rx="12" fill="#f1f5f9"/><text x="1639" y="708" text-anchor="middle">观察</text>
    <rect x="1702" y="680" width="114" height="42" rx="12" fill="#fef3c7"/><text x="1759" y="708" text-anchor="middle">等待</text>
    <rect x="1474" y="734" width="102" height="42" rx="12" fill="#fee2e2"/><text x="1525" y="762" text-anchor="middle">询问</text>
    <rect x="1588" y="734" width="102" height="42" rx="12" fill="#ede9fe"/><text x="1639" y="762" text-anchor="middle">审批</text>
    <rect x="1702" y="734" width="114" height="42" rx="12" fill="#e2e8f0"/><text x="1759" y="762" text-anchor="middle">停止</text>
  </g>

  <!-- Core arrows -->
  <path d="M290 318 C290 340 235 344 235 370" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M400 585 L455 585" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1385 585 L1440 585" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1460 324 C1440 342 1360 346 1305 370" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>

  <!-- World state / feedback -->
  <rect x="70" y="906" width="1780" height="112" rx="28" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="102" y="949" class="section" fill="#1d4ed8">05 世界状态与长期记忆 · 下一轮判断的共同底座</text>
  <text x="102" y="987" class="body">实体 Summary（现在是什么） · Fact（发生过什么） · Todo / Task / ExecutionRun（行动到哪了） · Progress / Effects（产生了什么结果）</text>
  <path d="M1645 800 C1645 858 1588 882 1510 906" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1662" y="863" class="small" fill="#047857">结果与新证据写回</text>
  <path d="M760 906 C760 858 810 832 850 800" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="510" y="870" class="small" fill="#1d4ed8">按需加载当前认知与历史证据</text>

  <rect x="1188" y="1030" width="662" height="38" rx="19" fill="#0f172a"/>
  <text x="1519" y="1056" text-anchor="middle" class="pill" fill="#ffffff">决策 = 持续选择下一步，直到真实结果被验证或形成明确停止理由</text>
</svg>
