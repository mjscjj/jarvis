<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis · 对话工作区原型</title><link rel="stylesheet" href="prototype.css"></head>
<body>
<div class="shell">
  <nav class="global" aria-label="主导航">
    <div class="brand"><span class="mark">J</span> Jarvis <span class="local">LOCAL</span></div>
    <button class="nav active" data-page="对话"><span>▤</span>对话</button>
    <button class="nav" data-page="工作台"><span>◫</span>工作台</button>
    <button class="nav" data-page="任务"><span>▷</span>任务</button>
    <button class="nav" data-page="世界"><span>◎</span>世界</button>
    <button class="nav" data-page="插件"><span>⊞</span>插件</button>
    <div class="nav-bottom"><div class="live"><i></i> 你的工作，持续推进</div><button class="nav" data-page="系统设置"><span>⚙</span>系统设置</button><div class="user"><span>C</span><div>我的工作空间<small>本地个人版</small></div></div></div>
  </nav>
  <aside class="history" aria-label="会话历史">
    <div class="history-title">对话 <button class="icon mobile" id="hideHistory" aria-label="关闭历史">×</button><span class="subtle">你的思考与行动</span></div>
    <button class="new" id="newSession">＋ 新对话 <kbd>⌘ K</kbd></button>
    <input class="search" id="search" placeholder="搜索会话和消息" aria-label="搜索会话和消息">
    <div id="sessionList" class="session-list"></div>
    <button class="archive-toggle" id="archives">查看已归档会话</button>
    <div class="history-foot">记录随时可回看<br><span>每个会话独立选择 Agent 和模型</span></div>
  </aside>
  <main>
    <header class="topbar"><button class="icon mobile" id="showHistory" aria-label="打开历史">☰</button><div class="heading"><div id="title" tabindex="0" role="button" aria-label="修改会话标题"></div><div id="subtitle" class="subtle"></div></div><button class="quiet" id="export">↓ 导出</button><button class="icon" id="more" aria-label="更多会话操作">···</button></header>
    <div class="demo-bar"><span>设计预览</span> 回复与业务资料为演示 · 模型选项来自本机快照 <a href="design.md" target="_blank">阅读完整设计 ↗</a></div>
    <div class="conversation" id="conversation"><div class="reading" id="messages" role="log" aria-label="对话记录"></div></div>
    <button id="jump" hidden>有新回复 ↓</button>
    <div class="composer-wrap">
      <div id="branchNote" class="branch-note" hidden></div>
      <form class="composer" id="composer">
        <div id="sourceChips" class="chips"></div><div id="attachments" class="attachments"></div>
        <textarea id="input" rows="2" placeholder="问一个问题，或告诉我你想推进什么…" aria-label="消息输入框"></textarea>
        <div class="controls"><div class="selectors"><button type="button" class="icon upload" id="upload" aria-label="添加图片或文件">＋</button><button type="button" class="pill" id="sources">◎ 数据来源</button><span class="divider"></span><button type="button" class="pill" id="agent"></button><button type="button" class="pill model-pill" id="model"></button><button type="button" class="pill effort-pill" id="effort" hidden></button></div><button type="submit" class="send" id="send" aria-label="发送消息">↑</button></div>
      </form>
      <div class="composer-hint"><span id="hint">Enter 发送 · Shift + Enter 换行 · 可粘贴或拖入图片</span><span class="desktop-hint">结合工作上下文，按需查证</span></div>
    </div>
  </main>
  <nav class="mobile-tabs" aria-label="手机主导航"><button class="selected" data-page="对话">▤<span>对话</span></button><button data-page="工作台">◫<span>工作台</span></button><button data-page="任务">▷<span>任务</span></button><button data-page="世界">◎<span>世界</span></button></nav>
</div>
<input type="file" id="fileInput" multiple hidden>
<dialog id="picker"><div class="dialog-head"><h2 id="pickerTitle"></h2><button class="icon" id="closePicker" aria-label="关闭选择器">×</button></div><p id="pickerNote" class="subtle"></p><input id="pickerSearch" class="search" placeholder="搜索全部模型" aria-label="搜索全部模型"><div id="pickerItems"></div><div id="pickerFooter"></div></dialog>
<dialog id="preview"><div class="dialog-head"><h2 id="previewTitle"></h2><button class="icon" id="closePreview" aria-label="关闭文件预览">×</button></div><div id="previewBody"></div></dialog>
<div id="toast" role="status" hidden></div>
<script src="models.js"></script><script src="prototype.js"></script>
</body></html>
