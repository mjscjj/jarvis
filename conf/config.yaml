# Jarvis 本地配置（本地可信环境，明文存储密钥/DSN）。
# 骨架阶段只有 server 段实际生效；其余段为后续里程碑预留，值可先留占位。

server:
  addr: "127.0.0.1:18800"
  web_root: "web/dist"
  log_files:                              # 调试面板尾读并归并的运行日志；stderr 里有各 cron 运行结果，必须一起读
    - "var/log/jarvis-server.log"
    - "var/log/jarvis-server.error.log"

# MySQL：本地可信环境，DSN 明文存储。请注意该文件包含明文开发库密码。
mysql:
  dsn: "root:your_mysql_password_here@tcp(127.0.0.1:3306)/jarvis?charset=utf8mb4&parseTime=true&loc=Local"
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 3600

# mem0 Python sidecar（总纲 §5）
mem0:
  base_url: "http://127.0.0.1:18900"
  owner_id: "owner"
  timeout_sec: 60
  batch_limit: 400
  window_gap_minutes: 30
  window_max_messages: 40
  schedule: "@every 10m"
  qdrant_host: "127.0.0.1"
  qdrant_port: 6333
  qdrant_grpc_port: 6334
  collection: "jarvis_memories"
  state_dir: "var/mem0"
  embedding_model: "text-embedding-v3"
  embedding_dims: 1024

# 高频抽取用 model API（M2/M3，OpenAI 兼容端点，可配置）
# 阿里云百炼 DashScope OpenAI 兼容端点；mem0 的 LLM 与 embedder 共用本段。
model:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "sk-170fbd90ff3f4d4491657722fd6de026"
  model: "qwen-plus"
  is_reasoning_model: false
  timeout_sec: 60

# M3 Todo 提取。enabled=true 时任一必填依赖为空都会启动失败，不静默跳过。
# 语义去重复用 mem0 embedding 模型，Qdrant 集合独立于 jarvis_memories。
extract:
  enabled: true
  principal_open_id: "ou_cfd9e106436c46adf20aaf9fe076c65d"
  schedule: "@every 10m"
  # 提取引擎：codex（默认，agent 可自跑 lark-cli/bytedcli/git/jarvis-tools 推算项目/仓库）
  #           model_api（备用 kimi function-calling 循环）
  engine: "codex"
  codex_sandbox: "danger-full-access"   # 本地可信环境，codex 可读写整机、联网
  codex_network: true                   # 开联网跑 lark-cli/bytedcli 查飞书侧信息
  codex_reasoning_effort: "low"         # 覆盖用户全局 xhigh，控单次耗时
  batch_messages: 400
  context_messages: 20
  context_window_minutes: 120
  open_todo_limit: 50
  memory_top_k: 8
  memory_threshold: 0.5
  max_prompt_chars: 60000
  semantic_collection: "todo_semantic"
  semantic_threshold: 0.85
  semantic_neighbor_limit: 3
  # M3 function-calling 工具循环
  max_tool_rounds: 5          # 单 unit 最多工具调用轮数，超出 fail-fast
  tool_timeout_sec: 10        # 单次工具调用超时（秒）
  history_tool_limit: 50      # query_chat_history 单次最多返回消息数
  tool_memory_max_top_k: 20   # search_memory 允许模型请求的 top_k 上限
  evidence_retry_max: 2       # source_quote 非逐字命中时，最多额外重抽次数（0=不重试）

# lark-cli 子进程封装（总纲 §4）
lark_cli:
  bin: "/Users/bytedance/.local/lib/node_modules/@larksuite/cli/bin/lark-cli"
  rate_limit: 5
  burst: 10
  concurrent: 2
  timeout_sec: 60

# M2 消息采集：首次发现从当前时刻起步，不回溯历史。
# related 群不再按 tier 分档调度，统一 scan_schedule 采集；hot/warm_age_hours 仅用于展示 tier 标签。
capture:
  page_size: 50
  scan_workers: 2
  hot_age_hours: 6
  warm_age_hours: 168
  timezone: "Asia/Shanghai"
  discover_schedule: "@every 6h"
  scan_schedule: "@every 5m"
  # discover 时按 active_time 自动纳入监听的内部真人私聊上限：只开最活跃的前 N 个，
  # 服务号私聊(p2p_target_type=bot)与僵尸老私聊不开。0=不自动开任何私聊。
  auto_related_p2p_top_n: 30

# M4 MVP：所有提取出的 Todo 都进入人工确认，不做评分、不调用 codex。
decide:
  enabled: true
  mode: "codex"          # codex: 用 codex gpt-5.5 判 auto_execute/need_review/need_info；manual_mvp: 全部走人工确认
  schedule: "@every 1m"
  batch_limit: 50
  codex_sandbox: "danger-full-access"   # M4 决策也可自查补信息（本地可信环境）
  codex_network: true
  codex_reasoning_effort: "medium"

# 底层 agent CLI：供 extract(M3)/decide(M4) 以及 chat 的 bin 复用。
# 与 execute 段独立——真正跑 Task 用 execute.bin/model。
codex:
  bin: "traex"
  model: "gpt-5.4"
  timeout_seconds: 600   # M3 抽取/M4 决策会多轮自跑 lark-cli/bytedcli 查飞书信息，放宽超时

# M5 任务执行：独立于上面的 codex 段。这里用官方 codex + 更强模型真正落地。
# 手动执行始终可用（POST /api/tasks/:id/execute）；enabled 仅控制自动 cron。
execute:
  enabled: true                                    # 全自动：M4 判 ready 建的 Task 由此 cron 自动执行（含对外动作 + push/MR）
  schedule: "@every 5m"
  batch_limit: 5
  concurrency: 3                                    # 单次 sweep 内并行执行的 Task 数
  repo_root: "/Users/bytedance/workspace-local"    # code_change 的 repo_ref 基目录
  runs_dir: "/Users/bytedance/workspace-local/jarvis/runs"  # diff/产物落盘
  bin: "codex"                                     # M5 用官方 Codex CLI（与 M3/M4 的 traex 分开）
  model: "gpt-5.6-sol"                             # Latest frontier（codex 无裸 gpt-5.6；luna/terra/sol 里 sol 最强）
  reasoning_effort: "medium"                       # 覆盖用户全局 xhigh，执行质量与耗时折中
  timeout_second: 600                              # 单次执行超时（改代码可能久）
  stale_executing_minute: 30                       # executing 超过此时长仍未结束 → 标 failed（防重启僵尸；须 > timeout）

# 基于 codex CLI 的流式对话（右侧对话框，SSE /api/chat）。enabled=false 时不注册路由。
# 复用 codex.bin；本地可信环境固定 danger-full-access + 联网，可直接读写 Jarvis MySQL、跑 CLI。
chat:
  enabled: true
  model: "gpt-5.4"                     # 对话模型（可与 codex.model 不同）
  timeout_seconds: 600                 # 单轮对话超时（可能自跑工具，放宽）
  sandbox: "danger-full-access"        # 对话场景最大权限
  reasoning_effort: "medium"           # 对话质量优先，覆盖用户全局 xhigh
