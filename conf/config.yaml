# Jarvis 本地配置（本地可信环境，明文存储密钥/DSN）。
# 骨架阶段只有 server 段实际生效；其余段为后续里程碑预留，值可先留占位。

server:
  addr: "127.0.0.1:18800"

# MySQL：本地可信环境，DSN 明文存储。请注意该文件包含明文开发库密码。
mysql:
  dsn: "root:your_mysql_password_here@tcp(127.0.0.1:3306)/jarvis?charset=utf8mb4&parseTime=true&loc=Local"
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 3600

# mem0 Python sidecar（总纲 §5）
mem0:
  base_url: "http://127.0.0.1:18900"
  owner_id: "owner"
  timeout_sec: 60
  batch_limit: 400
  window_gap_minutes: 30
  window_max_messages: 40
  schedule: "@every 10m"
  qdrant_host: "127.0.0.1"
  qdrant_port: 6333
  collection: "jarvis_memories"
  state_dir: "var/mem0"
  embedding_model: "bge_m3_embed"
  embedding_dims: 1024

# 高频抽取用 model API（M2/M3，OpenAI 兼容端点，可配置）
model:
  base_url: "https://api.kimi.com/coding/v1"
  api_key: "sk-kimi-SVPUeGtTe3E2Klfx9IoSRU7g2G5GCYfq9O4zldIZLtYmudxmsy8gXwTqWmJ1QcQF"
  model: "kimi-for-coding"
  is_reasoning_model: true
  timeout_sec: 60

# M3 Todo 提取。principal open_id 补齐前保持显式禁用；enabled=true 时
# 任一必填依赖为空都会启动失败，不静默跳过。
extract:
  enabled: true
  principal_open_id: "ou_cfd9e106436c46adf20aaf9fe076c65d"
  schedule: "@every 10m"
  batch_messages: 400
  context_messages: 20
  context_window_minutes: 120
  open_todo_limit: 50
  memory_top_k: 8
  memory_threshold: 0.5
  max_prompt_chars: 60000

# lark-cli 子进程封装（总纲 §4）
lark_cli:
  bin: "/Users/bytedance/.local/lib/node_modules/@larksuite/cli/bin/lark-cli"
  rate_limit: 5
  burst: 10
  concurrent: 2
  timeout_sec: 60

# M2 消息采集：首次发现从当前时刻起步，不回溯历史。
capture:
  page_size: 50
  scan_workers: 2
  hot_age_hours: 6
  warm_age_hours: 168
  timezone: "Asia/Shanghai"
  discover_schedule: "@every 1h"
  hot_schedule: "@every 5m"
  warm_schedule: "@every 30m"
  cold_schedule: "@every 6h"

# M4 决策用 codex CLI（总纲 §11.2，全部可配置）
codex:
  bin: "codex"
  model: "gpt-5.1-codex"
  timeout_seconds: 120
  max_calls_per_hour: 30
  max_calls_per_day: 200
  on_budget_exceeded: "route_need_decision" # 或 degrade_to_rule
  on_timeout: "route_need_decision"         # 固定 fail-safe
  gray_zone:
    conf_low: 0.60
    conf_high: 0.85
    risk_low: 0.25
    risk_high: 0.60
