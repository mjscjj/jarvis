# Optional OKR module configuration. Storage settings are loaded while `okr` is
# enabled; identity and Preview Review settings are validated only while
# `biz-okr` is enabled. Jarvis core has no OKR-specific config fields.
database_path: "data/okr/okr.db"
upload_dir: "data/okr/assets"
max_image_bytes: 10485760

# Independent OKR chat is never routed back to the ordinary host Agent.
# Build deploy/okr-chat first, then set enabled and the existing Codex login file.
# MVP supports the standard Codex ChatGPT connection; no host CLI config is mounted.
chat:
  development_container: ""
  enabled: false
  image: "jarvis-okr-chat:0.154.0"
  model: "gpt-5.6-sol"
  reasoning_effort: "high"
  timeout_seconds: 600
  auth_file: ""
  model_hosts:
    - "chatgpt.com:443"
    - "auth.openai.com:443"
    - "api.openai.com:443"

# 一次性 OKR Plan / 进度评审 Agent。只读建议，不建 Task、不进审批链路；沙箱需要
# 网络以便它用 okr-module-tools / biz-okr-tools 回查本机 API。
preview_review:
  bin: "traex"
  model: "DeepSeek-V4-Pro"
  reasoning_effort: "high"
  sandbox: "workspace-write"
  timeout_seconds: 300

feishu:
  app_id: ""
  cli_profile: ""

# Application binding belongs in okr-module.runtime.yaml.
identity:
  # Biz OKR uses its own low-sensitivity Feishu login instead of the optional
  # outer Jarvis ByteDance SSO gate.
  enabled: false
  # Configure the selected login application in the instance override.
  app_secret_env: "JARVIS_OKR_APP_SECRET"
  session_ttl_hours: 8760 # 365 天；网页登录状态存于私有运行数据库
  cookie_secure: false
  feishu_base_url: "https://open.feishu.cn"
  feishu_account_url: "https://accounts.feishu.cn"
  token_dir: "data/okr/feishu-tokens"
  scopes_file: "okr-feishu-scopes.txt"
