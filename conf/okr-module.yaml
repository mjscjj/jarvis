# Optional OKR module configuration. It is loaded only while modules.yaml
# enables `okr`; Jarvis core has no OKR-specific config fields.
database_path: "data/okr/okr.db"
upload_dir: "data/okr/assets"
max_image_bytes: 10485760

# 一次性 OKR Preview 评审 Agent。只读建议，不建 Task、不进审批链路；沙箱需要
# 网络以便它用 okr-module-tools / weekly-report-tools 回查本机 API。
preview_review:
  bin: "traex"
  model: "DeepSeek-V4-Pro"
  reasoning_effort: "high"
  sandbox: "workspace-write"
  timeout_seconds: 300

identity:
  enabled: true
  app_id: "cli_a96a0c8d82b85cb1"
  app_secret_env: "JARVIS_OKR_FEISHU_APP_SECRET"
  session_ttl_hours: 168
  cookie_secure: false
  feishu_base_url: "https://open.feishu.cn"
  feishu_account_url: "https://accounts.feishu.cn"
  token_dir: "data/okr/feishu-tokens"
  scopes_file: "okr-feishu-scopes.txt"
