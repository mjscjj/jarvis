# Optional OKR module configuration. Storage settings are loaded while `okr` is
# enabled; identity and Preview Review settings are validated only while
# `biz-okr` is enabled. Jarvis core has no OKR-specific config fields.
database_path: "data/okr/okr.db"
upload_dir: "data/okr/assets"
max_image_bytes: 10485760

# 一次性 OKR Preview 评审 Agent。只读建议，不建 Task、不进审批链路；沙箱需要
# 网络以便它用 okr-module-tools / biz-okr-tools 回查本机 API。
preview_review:
  bin: "traex"
  model: "DeepSeek-V4-Pro"
  reasoning_effort: "high"
  sandbox: "workspace-write"
  timeout_seconds: 300

identity:
  enabled: true
  # Biz OKR 专用登录应用 Emily Pro。只签发登录用户自己的 user token，与
  # lark-cli 绑定的主应用无关：主应用凭证由 lark-cli 自己保管，不读这里。
  # 换应用后 open_id 会变（按应用隔离），union_id 不变，所以署名锚 union_id。
  app_id: "cli_a96a2422f03bdbd7"
  app_secret_env: "JARVIS_OKR_EMILY_APP_SECRET"
  session_ttl_hours: 168
  cookie_secure: false
  feishu_base_url: "https://open.feishu.cn"
  feishu_account_url: "https://accounts.feishu.cn"
  token_dir: "data/okr/feishu-tokens"
  scopes_file: "okr-feishu-scopes.txt"
