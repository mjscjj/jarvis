[project]
name = "jarvis-mem0-sidecar"
version = "0.1.0"
description = "Local FastAPI wrapper around mem0 for Jarvis"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi==0.139.2",
  "mem0ai==2.0.12",
  "pyyaml==6.0.3",
  "qdrant-client==1.18.0",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = ["httpx2==2.7.0"]

[tool.uv]
package = false
