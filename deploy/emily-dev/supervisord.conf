[unix_http_server]
file=/dev-state/supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
umask=0077
pidfile=/dev-state/supervisord.pid
logfile=/opt/jarvis/var/log/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///dev-state/supervisor.sock

[program:ingress]
command=/usr/bin/socat UNIX-LISTEN:/run/emily-web/web.sock,unlink-early,mode=600,fork TCP:127.0.0.1:18812
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/jarvis/var/log/ingress.log
stderr_logfile=/opt/jarvis/var/log/ingress.error.log

[program:jarvis-server]
command=/opt/jarvis/bin/jarvis-server -config "%(ENV_JARVIS_CONFIG_PATH)s"
directory=/opt/jarvis
autorestart=true
startsecs=0
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/jarvis/var/log/jarvis-server.log
stderr_logfile=/opt/jarvis/var/log/jarvis-server.error.log
