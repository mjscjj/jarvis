<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
  <!-- Header -->
  <text x="80" y="70" font-family="Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#17203B">Jarvis 世界模型</text>
  <text x="80" y="108" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#667085">以 Principal 为坐标，持续理解「我、人、事、场、物」</text>

  <g>
    <rect x="610" y="42" width="1110" height="78" rx="18" fill="#FFFFFF" stroke="#DDE3EE" stroke-width="2"/>
    <text x="646" y="91" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#17203B">世界模型</text>
    <text x="766" y="91" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#98A2B3">=</text>
    <rect x="812" y="61" width="176" height="40" rx="20" fill="#EAF8F3"/>
    <text x="900" y="88" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#237A63">实体与关系</text>
    <text x="1008" y="91" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#98A2B3">+</text>
    <rect x="1044" y="61" width="176" height="40" rx="20" fill="#F1EDFF"/>
    <text x="1132" y="88" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#6D50BE">当前认知</text>
    <text x="1240" y="91" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#98A2B3">+</text>
    <rect x="1276" y="61" width="194" height="40" rx="20" fill="#E9F1FF"/>
    <text x="1373" y="88" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#356AE6">时间化证据</text>
    <text x="1490" y="91" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#98A2B3">+</text>
    <rect x="1526" y="61" width="164" height="40" rx="20" fill="#FFF2D8"/>
    <text x="1608" y="88" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#A96000">行动状态</text>
  </g>

  <!-- Long-lived entities layer -->
  <g>
    <rect x="80" y="160" width="1050" height="680" rx="28" fill="#FFFFFF" stroke="#B9E2D5" stroke-width="3"/>
    <rect x="106" y="184" width="178" height="38" rx="19" fill="#DFF5ED"/>
    <circle cx="128" cy="203" r="6" fill="#2F9B7C"/>
    <text x="148" y="210" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#237A63">长期实体与关系</text>
    <text x="1070" y="210" text-anchor="end" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#548273">稳定坐标系</text>

    <!-- relationship spokes -->
    <path d="M593 480 C510 415 432 355 335 320" fill="none" stroke="#8BC5B3" stroke-width="4"/>
    <path d="M685 460 C770 390 826 330 900 300" fill="none" stroke="#8BC5B3" stroke-width="4"/>
    <path d="M720 520 C810 520 852 512 920 500" fill="none" stroke="#8BC5B3" stroke-width="4"/>
    <path d="M676 586 C760 642 814 685 890 704" fill="none" stroke="#8BC5B3" stroke-width="4"/>
    <path d="M574 583 C492 644 418 682 330 704" fill="none" stroke="#8BC5B3" stroke-width="4"/>

    <!-- Person -->
    <g>
      <rect x="172" y="256" width="292" height="128" rx="24" fill="#EAF8F3" stroke="#52AD91" stroke-width="3"/>
      <circle cx="212" cy="296" r="21" fill="#C7EBDD"/>
      <circle cx="212" cy="289" r="7" fill="#237A63"/>
      <path d="M199 309 C202 298 222 298 225 309" fill="none" stroke="#237A63" stroke-width="5" stroke-linecap="round"/>
      <text x="247" y="302" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#173D34">Person</text>
      <rect x="385" y="276" width="54" height="30" rx="15" fill="#FFFFFF"/>
      <text x="412" y="297" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#237A63">人</text>
      <text x="204" y="347" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#548273">角色、协作对象与关系</text>
    </g>

    <!-- Project -->
    <g>
      <rect x="776" y="238" width="284" height="124" rx="24" fill="#EAF8F3" stroke="#52AD91" stroke-width="3"/>
      <circle cx="818" cy="278" r="21" fill="#C7EBDD"/>
      <path d="M808 278 L816 286 L830 269" fill="none" stroke="#237A63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="853" y="285" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#173D34">Project</text>
      <rect x="990" y="258" width="46" height="30" rx="15" fill="#FFFFFF"/>
      <text x="1013" y="279" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#237A63">事</text>
      <text x="808" y="326" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#548273">长期目标与工作上下文</text>
    </g>

    <!-- KeyMatter -->
    <g>
      <rect x="822" y="434" width="280" height="124" rx="24" fill="#EAF8F3" stroke="#52AD91" stroke-width="3"/>
      <circle cx="864" cy="474" r="21" fill="#C7EBDD"/>
      <path d="M864 460 L868 470 L879 474 L868 478 L864 489 L860 478 L849 474 L860 470 Z" fill="#237A63"/>
      <text x="899" y="481" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#173D34">KeyMatter</text>
      <rect x="1030" y="454" width="46" height="30" rx="15" fill="#FFFFFF"/>
      <text x="1053" y="475" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#237A63">事</text>
      <text x="854" y="522" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#548273">当下重点与关键事项</text>
    </g>

    <!-- Group -->
    <g>
      <rect x="770" y="648" width="298" height="124" rx="24" fill="#EAF8F3" stroke="#52AD91" stroke-width="3"/>
