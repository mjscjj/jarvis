    <text x="1295" y="333" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#F2EEFF">当前认知：现在是什么</text>

    <rect x="1204" y="392" width="232" height="178" rx="22" fill="#F4F0FF" stroke="#B8A5EF" stroke-width="2"/>
    <circle cx="1245" cy="435" r="20" fill="#DED5FA"/>
    <path d="M1235 435 H1255 M1245 425 V445" stroke="#6D50BE" stroke-width="3" stroke-linecap="round"/>
    <text x="1278" y="442" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#422F78">Fact</text>
    <text x="1232" y="487" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#6D50BE">发生过什么</text>
    <text x="1232" y="517" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#7B6B9D">带时间与来源</text>
    <rect x="1232" y="534" width="104" height="24" rx="12" fill="#E6DEFA"/>
    <text x="1284" y="551" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#6D50BE">现实证据</text>

    <rect x="1454" y="392" width="232" height="178" rx="22" fill="#F8F6FC" stroke="#CFC6DD" stroke-width="2"/>
    <circle cx="1495" cy="435" r="20" fill="#EAE5F1"/>
    <path d="M1486 435 C1486 425 1504 425 1504 435 C1504 445 1486 445 1486 435" fill="none" stroke="#7B6B9D" stroke-width="3"/>
    <text x="1528" y="442" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#4C415E">PageRevision</text>
    <text x="1482" y="487" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#6B5D7C">旧版 Summary</text>
    <text x="1482" y="517" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#7B6B9D">认知改写审计</text>
    <rect x="1482" y="534" width="92" height="24" rx="12" fill="#FFE6E6"/>
    <text x="1528" y="551" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#B42318">不是 Fact</text>

    <!-- One precise cross-layer relation -->
    <path d="M1130 390 H1150 V292 H1170" fill="none" stroke="#7957D5" stroke-width="3" stroke-dasharray="8 8"/>
    <polygon points="1170,292 1156,284 1156,300" fill="#7957D5"/>
  </g>

  <!-- Action state layer -->
  <g>
    <rect x="80" y="872" width="1640" height="150" rx="28" fill="#FFF9EC" stroke="#F1C875" stroke-width="3"/>
    <rect x="106" y="896" width="178" height="38" rx="19" fill="#FFF0C8"/>
    <circle cx="128" cy="915" r="6" fill="#D68A14"/>
    <text x="148" y="922" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#A96000">实时行动状态</text>
    <rect x="304" y="900" width="126" height="30" rx="15" fill="#FFFFFF" stroke="#F1C875"/>
    <text x="367" y="921" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="14" font-weight="700" fill="#A96000">不是长期实体</text>

    <rect x="510" y="895" width="260" height="102" rx="22" fill="#FFFFFF" stroke="#E0A336" stroke-width="2"/>
    <text x="640" y="937" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#7A4600">Todo</text>
    <text x="640" y="968" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#A96000">发现了什么</text>

    <polyline points="786,946 838,946" fill="none" stroke="#D68A14" stroke-width="4"/>
    <polygon points="850,946 836,938 836,954" fill="#D68A14"/>

    <rect x="850" y="895" width="260" height="102" rx="22" fill="#FFFFFF" stroke="#E0A336" stroke-width="2"/>
    <text x="980" y="937" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#7A4600">Task</text>
    <text x="980" y="968" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#A96000">正在承接什么目标</text>

    <polyline points="1126,946 1178,946" fill="none" stroke="#D68A14" stroke-width="4"/>
    <polygon points="1190,946 1176,938 1176,954" fill="#D68A14"/>

    <rect x="1190" y="895" width="320" height="102" rx="22" fill="#FFFFFF" stroke="#E0A336" stroke-width="2"/>
    <text x="1350" y="937" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#7A4600">ExecutionRun</text>
    <text x="1350" y="968" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#A96000">这次执行产生了什么结果</text>
  </g>

  <text x="80" y="1058" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#98A2B3">结构视图：长期实体描述世界 · 认知记录解释 Jarvis 如何理解世界 · 行动状态描述正在发生的工作</text>
</svg>
