      <rect x="996" y="668" width="46" height="30" rx="15" fill="#FFFFFF"/>
      <text x="1019" y="689" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#237A63">场</text>
      <text x="802" y="736" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#548273">群组、组织与沟通语境</text>
