      <circle cx="807" cy="682" r="5" fill="#237A63"/>
      <circle cx="819" cy="682" r="5" fill="#237A63"/>
      <path d="M799 699 C801 690 813 690 815 699 M811 699 C813 690 825 690 827 699" fill="none" stroke="#237A63" stroke-width="3" stroke-linecap="round"/>
