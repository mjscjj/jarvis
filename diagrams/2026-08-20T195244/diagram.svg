      <circle cx="200" cy="688" r="21" fill="#C7EBDD"/>
      <path d="M191 675 H205 L211 681 V701 H191 Z M205 675 V682 H211" fill="none" stroke="#237A63" stroke-width="3" stroke-linejoin="round"/>
      <text x="235" y="695" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#173D34">Resource</text>
      <rect x="386" y="668" width="46" height="30" rx="15" fill="#FFFFFF"/>
      <text x="409" y="689" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#237A63">物</text>
      <text x="190" y="736" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#548273">文档、产物与可引用资料</text>
    </g>

    <!-- Principal nucleus -->
    <g>
      <circle cx="640" cy="522" r="132" fill="#EAF0FF" stroke="#AFC3F4" stroke-width="16"/>
      <circle cx="640" cy="522" r="112" fill="#FFFFFF" stroke="#356AE6" stroke-width="5"/>
      <rect x="601" y="438" width="78" height="32" rx="16" fill="#356AE6"/>
      <text x="640" y="460" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">我</text>
      <text x="640" y="512" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#17203B">Principal</text>
      <text x="640" y="548" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#356AE6">认知坐标系</text>
      <text x="640" y="582" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#667085">关系围绕我组织</text>
    </g>

    <rect x="362" y="792" width="486" height="30" rx="15" fill="#F2F7F5"/>
    <text x="605" y="813" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#548273">关系：角色 · 归属 · 协作 · 引用 · 语境</text>
  </g>

  <!-- Cognitive layer -->
  <g>
    <rect x="1170" y="160" width="550" height="480" rx="28" fill="#FFFFFF" stroke="#D9CCFF" stroke-width="3"/>
    <rect x="1196" y="184" width="150" height="38" rx="19" fill="#EFE9FF"/>
    <circle cx="1218" cy="203" r="6" fill="#7957D5"/>
    <text x="1238" y="210" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700" fill="#6D50BE">认知记录层</text>
    <text x="1690" y="210" text-anchor="end" font-family="Noto Sans SC, sans-serif" font-size="15" fill="#7B6B9D">每个长期实体均附带</text>

    <rect x="1204" y="250" width="482" height="118" rx="22" fill="#6D50BE"/>
    <circle cx="1252" cy="309" r="26" fill="#8B70D7"/>
