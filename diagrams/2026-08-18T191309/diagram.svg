<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <!-- Canvas -->
  <rect x="0" y="0" width="1920" height="1200" fill="#FFFFFF"/>

  <!-- Page title -->
  <text x="80" y="66" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="34" font-weight="700">Jarvis 如何建立并持续更新自己的世界观</text>
  <text x="80" y="105" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="17">以 Principal 为坐标，维护长期对象、当前认知、历史证据与未闭环行动。</text>
  <line x1="80" y1="126" x2="174" y2="126" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>

  <!-- Upper: world model -->
  <rect x="70" y="150" width="1780" height="620" rx="28" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="105" y="194" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="24" font-weight="700">世界模型：Principal 坐标下的工作世界</text>
  <text x="105" y="225" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14">关系连接对象，时间组织变化；它们是贯穿整个模型的维度，不是独立实体。</text>
  <line x1="105" y1="244" x2="1815" y2="244" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="1000" y1="268" x2="1000" y2="642" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Left: entity network labels -->
  <text x="110" y="281" fill="#2563EB" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="16" font-weight="700">长期实体网络</text>
  <text x="234" y="281" fill="#94A3B8" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">稳定对象，而不是短期任务状态</text>

  <!-- Principal-only relation lines -->
  <line x1="550" y1="470" x2="265" y2="369" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="550" y1="470" x2="550" y2="324" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="550" y1="470" x2="840" y2="369" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="550" y1="470" x2="315" y2="584" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="550" y1="470" x2="800" y2="584" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Peripheral entities -->
  <rect x="170" y="330" width="190" height="78" rx="18" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <circle cx="198" cy="359" r="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="220" y="360" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="17" font-weight="700">Person</text>
  <text x="198" y="389" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">角色 · 职责 · 承诺</text>

  <rect x="450" y="285" width="200" height="78" rx="18" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <rect x="474" y="308" width="20" height="20" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="510" y="324" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="17" font-weight="700">Project</text>
  <text x="474" y="347" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">目标 · 进展 · 风险</text>

  <rect x="740" y="330" width="200" height="78" rx="18" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <circle cx="766" cy="359" r="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="792" y="360" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="17" font-weight="700">Key Matter</text>
  <text x="754" y="389" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">长期关注 · 尚待闭环</text>

  <rect x="220" y="545" width="190" height="78" rx="18" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <circle cx="248" cy="574" r="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <circle cx="248" cy="574" r="3" fill="#2563EB"/>
  <text x="270" y="579" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="17" font-weight="700">Group</text>
  <text x="248" y="604" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">协作场 · 群上下文</text>

  <rect x="700" y="545" width="200" height="78" rx="18" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <rect x="724" y="560" width="24" height="28" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <line x1="730" y1="568" x2="742" y2="568" stroke="#2563EB" stroke-width="2"/>
  <line x1="730" y1="576" x2="742" y2="576" stroke="#2563EB" stroke-width="2"/>
  <text x="766" y="579" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="17" font-weight="700">Resource</text>
  <text x="724" y="604" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">文档 · 仓库 · 系统入口</text>

  <!-- Principal -->
  <circle cx="550" cy="470" r="94" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <circle cx="550" cy="470" r="74" fill="#2563EB"/>
  <circle cx="550" cy="438" r="16" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M518 481 C522 456 578 456 582 481" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="550" y="516" text-anchor="middle" fill="#FFFFFF" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="19" font-weight="700">Principal / 我</text>
  <text x="550" y="540" text-anchor="middle" fill="#DBEAFE" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12">观察、价值与责任坐标</text>

  <!-- Cross-cutting relation dimension -->
  <rect x="110" y="628" width="430" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="128" y="647" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">关系维度：职责 · 归属 · 协作 · 引用</text>

  <!-- Right: cognition structure -->
  <text x="1060" y="281" fill="#2563EB" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="16" font-weight="700">每个实体的认知结构</text>
  <text x="1228" y="281" fill="#94A3B8" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">当前结论与历史依据分开保存</text>

  <rect x="1080" y="310" width="670" height="140" rx="20" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <rect x="1080" y="310" width="8" height="140" rx="4" fill="#2563EB"/>
  <rect x="1115" y="337" width="46" height="46" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <line x1="1128" y1="350" x2="1148" y2="350" stroke="#2563EB" stroke-width="2"/>
  <line x1="1128" y1="359" x2="1148" y2="359" stroke="#2563EB" stroke-width="2"/>
  <line x1="1128" y1="368" x2="1142" y2="368" stroke="#2563EB" stroke-width="2"/>
  <text x="1185" y="357" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="23" font-weight="700">Entity Summary</text>
  <text x="1185" y="389" fill="#2563EB" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="16" font-weight="600">当前认知 · 现在是什么</text>
  <text x="1115" y="425" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14">压缩成下一轮判断可直接使用的当前最佳结论；新证据可以补充、修正或推翻它。</text>

  <rect x="1080" y="500" width="390" height="108" rx="18" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <rect x="1080" y="500" width="8" height="108" rx="4" fill="#D97706"/>
  <text x="1115" y="535" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="21" font-weight="700">Fact</text>
  <text x="1115" y="563" fill="#D97706" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" font-weight="600">历史证据 · 发生过什么</text>
  <text x="1115" y="590" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">按时间保留可追溯的事实与变化依据</text>

  <!-- Fact supports or corrects Summary -->
  <line x1="1275" y1="500" x2="1275" y2="462" stroke="#D97706" stroke-width="2.5"/>
  <polygon points="1275,452 1267,465 1283,465" fill="#D97706"/>
  <text x="1292" y="480" fill="#D97706" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12">支撑 / 修正</text>

  <!-- PageRevision is not a world fact -->
  <rect x="1510" y="520" width="240" height="62" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="1530" y="545" fill="#475569" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" font-weight="700">PageRevision</text>
  <text x="1530" y="567" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12">保存旧版 Summary，不是现实事实</text>
  <line x1="1630" y1="520" x2="1630" y2="462" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Cross-cutting time dimension -->
  <rect x="1060" y="628" width="690" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1078" y="647" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">时间维度：过去的证据 → 当前认知 → 尚未闭环的下一步</text>

  <!-- One light relation from entity world to action state -->
  <line x1="550" y1="564" x2="550" y2="670" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Upper bottom: active work band -->
  <rect x="95" y="670" width="1730" height="72" rx="18" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="125" y="699" fill="#059669" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" font-weight="700">行动状态</text>
  <text x="125" y="724" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">不是长期实体，而是正在发生的工作</text>

  <rect x="565" y="685" width="150" height="42" rx="12" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
  <text x="640" y="712" text-anchor="middle" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" font-weight="700">Todo</text>
  <line x1="715" y1="706" x2="764" y2="706" stroke="#059669" stroke-width="2"/>
  <polygon points="774,706 760,698 760,714" fill="#059669"/>
  <rect x="774" y="685" width="150" height="42" rx="12" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
  <text x="849" y="712" text-anchor="middle" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" font-weight="700">Task</text>
  <line x1="924" y1="706" x2="973" y2="706" stroke="#059669" stroke-width="2"/>
  <polygon points="983,706 969,698 969,714" fill="#059669"/>
  <rect x="983" y="685" width="220" height="42" rx="12" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
  <text x="1093" y="712" text-anchor="middle" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" font-weight="700">ExecutionRun</text>
  <text x="1250" y="701" fill="#059669" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" font-weight="600">线索被判断、任务被推进、行动产生真实结果</text>
  <text x="1250" y="724" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="12">未闭环状态进入下一轮世界观构造</text>

  <!-- Lower: continuous reconstruction loop -->
  <text x="80" y="838" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="24" font-weight="700">世界观不是一次建成的，它在每轮感知和行动中被重新构造</text>
  <text x="80" y="868" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14">持续演化闭环</text>

  <!-- Flow arrows behind cards -->
  <line x1="325" y1="957" x2="356" y2="957" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="366,957 352,949 352,965" fill="#94A3B8"/>
  <line x1="610" y1="957" x2="641" y2="957" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="651,957 637,949 637,965" fill="#94A3B8"/>
  <line x1="895" y1="957" x2="926" y2="957" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="936,957 922,949 922,965" fill="#94A3B8"/>
  <line x1="1180" y1="957" x2="1211" y2="957" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="1221,957 1207,949 1207,965" fill="#94A3B8"/>
  <line x1="1465" y1="957" x2="1496" y2="957" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="1506,957 1492,949 1492,965" fill="#94A3B8"/>

  <!-- Step 01 -->
  <rect x="80" y="890" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="80" y="890" width="5" height="145" rx="2.5" fill="#D97706"/>
  <text x="104" y="919" fill="#D97706" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" font-weight="700">01</text>
  <text x="104" y="951" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="18" font-weight="700">感知变化</text>
  <text x="104" y="979" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">捕捉消息、事件与状态变化</text>

  <!-- Step 02 -->
  <rect x="365" y="890" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="365" y="890" width="5" height="145" rx="2.5" fill="#2563EB"/>
  <text x="389" y="919" fill="#2563EB" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" font-weight="700">02</text>
  <text x="389" y="951" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="18" font-weight="700">更新世界模型</text>
  <text x="389" y="979" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">把变化写成可追溯事实</text>
  <text x="389" y="1008" fill="#94A3B8" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11">FactEngine 主要维护者</text>

  <!-- Step 03 -->
  <rect x="650" y="890" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="650" y="890" width="5" height="145" rx="2.5" fill="#2563EB"/>
  <text x="674" y="919" fill="#2563EB" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" font-weight="700">03</text>
  <text x="674" y="951" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="18" font-weight="700">构造世界观</text>
  <text x="674" y="979" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">围绕当前目标投影可用认知</text>

  <!-- Step 04 -->
  <rect x="935" y="890" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="935" y="890" width="5" height="145" rx="2.5" fill="#7C3AED"/>
  <text x="959" y="919" fill="#7C3AED" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" font-weight="700">04</text>
  <text x="959" y="951" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="18" font-weight="700">自主决策</text>
  <text x="959" y="979" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">行动、等待、询问</text>
  <text x="959" y="1001" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">或 NOTHING</text>
  <text x="959" y="1023" fill="#94A3B8" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="10">M3 线索准入 / Proactive 周期巡视</text>

  <!-- Step 05 -->
  <rect x="1220" y="890" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="1220" y="890" width="5" height="145" rx="2.5" fill="#059669"/>
  <text x="1244" y="919" fill="#059669" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" font-weight="700">05</text>
  <text x="1244" y="951" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="18" font-weight="700">执行与验证</text>
  <text x="1244" y="979" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">行动，并确认现实真的改变</text>
  <text x="1244" y="1008" fill="#94A3B8" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="11">M5 执行与验证</text>

  <!-- Step 06 -->
  <rect x="1505" y="890" width="335" height="145" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="1505" y="890" width="5" height="145" rx="2.5" fill="#D97706"/>
  <text x="1529" y="919" fill="#D97706" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13" font-weight="700">06</text>
  <text x="1529" y="951" fill="#0F172A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="18" font-weight="700">结果回到证据</text>
  <text x="1529" y="979" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">ExecutionRun 结果与 effects</text>
  <text x="1529" y="1001" fill="#64748B" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="13">成为下一轮判断的新事实</text>

  <!-- 06 back to 01 -->
  <polyline points="1672,1035 1672,1084 202,1084 202,1048" fill="none" stroke="#059669" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="202,1037 193,1052 211,1052" fill="#059669"/>
  <rect x="672" y="1098" width="576" height="34" rx="17" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="960" y="1121" text-anchor="middle" fill="#059669" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" font-weight="600">行动改变世界，变化再次塑造 Agent 的世界观</text>
</svg>
